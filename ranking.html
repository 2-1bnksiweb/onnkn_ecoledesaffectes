<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    
    <title>最速脱出ランキング - 恐怖の廃校</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;900&family=Yuji+Boku&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'OnryouFont';
            src: url('home/onryu.ttf') format('truetype'),
                 url('./home/onryu.ttf') format('truetype'),
                 url('home/onryou.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        *, *::before, *::after, body, h1, h2, h3, p, span, a, button, div, header, li { 
            font-family: 'OnryouFont', 'Yuji Boku', 'Shippori Mincho', serif !important; 
        }

        body { 
            background-color: #030303; 
            color: #d1d1d1; 
            overflow-x: hidden; 
            min-height: 100dvh; 
        }

        .text-blood-dark {
            background: linear-gradient(180deg, #ff1a1a 0%, #b30000 40%, #4d0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 2px #000000) drop-shadow(0 0 10px rgba(0,0,0,0.9));
        }
    </style>
</head>
<body class="relative">

    <!-- 🩸 血の装飾群（背景 z-0） -->

        <defs>
            <linearGradient id="realBloodGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#450000" />
                <stop offset="45%" stop-color="#780202" />
                <stop offset="90%" stop-color="#940303" />
            </linearGradient>
        </defs>
        <path d="M0,0 L1000,0 L1000,25 C985,25 980,125 970,125 C960,125 955,35 945,35 C935,35 930,200 920,200 C910,200 905,55 895,55 C885,55 880,110 870,110 C860,110 855,40 845,40 C835,40 830,230 818,230 C808,230 802,45 790,45 C775,45 770,150 760,150 C750,150 745,30 730,30 C715,30 710,180 700,180 C690,180 685,50 670,50 C655,50 650,120 640,120 C630,120 625,35 610,35 C595,35 590,255 575,255 C562,255 558,65 540,65 C525,65 520,160 510,160 C500,160 495,40 480,40 C465,40 460,220 445,220 C435,220 430,55 415,55 C400,55 395,140 385,140 C375,140 370,30 355,30 C340,30 335,190 325,190 C315,190 310,45 295,45 C280,45 275,110 265,110 C255,110 250,35 235,35 C220,35 215,240 200,240 C190,240 185,60 170,60 C155,60 150,150 140,150 C130,150 125,30 110,30 C95,30 90,200 80,200 C70,200 65,50 50,50 C35,50 30,120 20,120 C10,120 5,25 0,25 Z" fill="url(#realBloodGrad)" />
    </svg>
    <svg class="fixed top-0 left-0 w-56 h-56 pointer-events-none z-0 opacity-40" viewBox="0 0 200 200">
        <path d="M0,0 L90,0 C75,25 100,50 75,65 C55,80 45,110 20,90 C5,80 0,100 0,100 Z" fill="#660101" />
        <g fill="#7a0202"><circle cx="110" cy="25" r="4.5" /><circle cx="130" cy="38" r="2.5" /><circle cx="95" cy="85" r="5" /></g>
    </svg>
    <svg class="fixed top-0 right-0 w-56 h-56 pointer-events-none z-0 opacity-40" viewBox="0 0 200 200" style="transform: scaleX(-1);">
        <path d="M0,0 L90,0 C75,25 100,50 75,65 C55,80 45,110 20,90 C5,80 0,100 0,100 Z" fill="#660101" />
        <g fill="#7a0202"><circle cx="110" cy="25" r="4.5" /><circle cx="130" cy="38" r="2.5" /><circle cx="95" cy="85" r="5" /></g>
    </svg>
    <svg class="fixed bottom-0 left-0 w-60 h-60 pointer-events-none z-0 opacity-40" viewBox="0 0 200 200" style="transform: scaleY(-1);">
        <path d="M0,0 L100,0 C80,30 110,55 85,75 C60,95 50,125 25,105 C5,95 0,115 0,115 Z" fill="#5c0101" />
        <g fill="#7a0202"><circle cx="120" cy="30" r="5" /><circle cx="105" cy="95" r="5.5" /></g>
    </svg>
    <svg class="fixed bottom-0 right-0 w-60 h-60 pointer-events-none z-0 opacity-40" viewBox="0 0 200 200" style="transform: scale(-1, -1);">
        <path d="M0,0 L100,0 C80,30 110,55 85,75 C60,95 50,125 25,105 C5,95 0,115 0,115 Z" fill="#5c0101" />
        <g fill="#7a0202"><circle cx="120" cy="30" r="5" /><circle cx="105" cy="95" r="5.5" /></g>
    </svg>

    <div class="max-w-4xl mx-auto p-6 relative z-20 mt-10 mb-12">
        <a href="index.html" class="text-xs text-red-500 hover:text-red-300 mb-4 inline-block">&lt; ホームへ戻る</a>
        <h1 class="text-4xl sm:text-5xl font-black text-center text-blood-dark mb-10 tracking-widest relative z-10">TOP RANKING</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 relative z-10">
            <!-- 初回ランキング -->
            <div class="bg-gray-950/90 p-6 rounded-lg shadow-2xl border-t-4 border-red-800 border-x border-b border-red-950/50">
                <h2 class="text-2xl font-bold text-red-500 mb-4 border-b border-red-950 pb-2">【初回】挑戦者ランキング</h2>
                <ul id="first-timer-list" class="space-y-3">
                    <p class="text-gray-500">データ集計中...</p>
                </ul>
            </div>

            <!-- リピーターランキング -->
            <div id="repeater-section" class="bg-gray-950/90 p-6 rounded-lg shadow-2xl border-t-4 border-red-700 border-x border-b border-red-950/50 hidden">
                <h2 class="text-2xl font-bold text-red-400 mb-4 border-b border-red-950 pb-2">【2回目以降】猛者ランキング</h2>
                <ul id="repeater-list" class="space-y-3">
                </ul>
            </div>
        </div>
    </div>

    <script>
        db.collection('settings').doc('config').onSnapshot(doc => {
            if(doc.exists && doc.data().showRepeaters) {
                document.getElementById('repeater-section').style.display = 'block';
            } else {
                document.getElementById('repeater-section').style.display = 'none';
            }
        });

        db.collection('times').onSnapshot(snapshot => {
            const firstTimers = {};
            const repeaters = {};

            snapshot.forEach(doc => {
                const data = doc.data();
                if(data.count === 1) {
                    if(!firstTimers[data.teamName] || firstTimers[data.teamName].time > data.time) {
                        firstTimers[data.teamName] = data;
                    }
                } else {
                    if(!repeaters[data.teamName] || repeaters[data.teamName].time > data.time) {
                        repeaters[data.teamName] = data;
                    }
                }
            });

            renderList('first-timer-list', Object.values(firstTimers));
            renderList('repeater-list', Object.values(repeaters));
        });

        function renderList(elementId, dataArray) {
            const list = document.getElementById(elementId);
            list.innerHTML = '';
            
            dataArray.sort((a, b) => a.time - b.time).slice(0, 10).forEach((data, index) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-gray-900/80 border border-red-950/40 p-3 rounded text-gray-200 shadow-sm";
                
                let rankStyle = "text-xl font-bold ";
                if(index === 0) rankStyle += "text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.6)]";
                else if(index === 1) rankStyle += "text-gray-300";
                else if(index === 2) rankStyle += "text-amber-600";
                
                const countBadge = data.count > 1 ? `<span class="text-xs bg-red-900 border border-red-700 text-red-200 px-2 py-0.5 rounded ml-2">${data.count}回目</span>` : '';
                
                li.innerHTML = `
                    <div class="flex items-center">
                        <span class="w-8 ${rankStyle}">#${index + 1}</span>
                        <span class="font-bold text-lg text-white">${data.teamName}</span>
                        ${countBadge}
                    </div>
                    <span class="font-mono text-xl text-red-400 font-bold">${formatTime(data.time)}</span>
                `;
                list.appendChild(li);
            });
            
            if(dataArray.length === 0) list.innerHTML = '<p class="text-gray-500">まだ記録がありません</p>';
        }

        function formatTime(ms) {
            const m = Math.floor(ms / 60000).toString().padStart(2, '0');
            const s = Math.floor((ms % 60000) / 1000).toString().padStart(2, '0');
            const c = Math.floor((ms % 1000) / 10).toString().padStart(2, '0');
            return `${m}:${s}.${c}`;
        }
    </script>
</body>
</html>
