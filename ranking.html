<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020403">
    
    <title>親友救出記録 - 恐怖の廃校</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;900&family=Yuji+Boku&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'OnryouFont';
            src: url('home/onryu.ttf') format('truetype'), url('./home/onryu.ttf') format('truetype'), url('home/onryou.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        body, h1, h2, h3, p, span, a, button, div, header, li { 
            font-family: 'OnryouFont', 'Yuji Boku', 'Shippori Mincho', serif; 
        }

        .font-mono-tech {
            font-family: 'Share Tech Mono', monospace !important;
        }

        body { 
            background-color: #020403; 
            color: #d1d5db; 
            overflow-x: hidden; 
            min-height: 100dvh; 
        }

        /* 救出記録発光タイトル */
        .text-rescue-glow {
            background: linear-gradient(180deg, #ff4d4d 0%, #b30000 50%, #3d0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 30, 30, 0.6)) drop-shadow(2px 2px 4px #000);
        }

        /* 遠くの不穏な影のゆらめき */
        @keyframes shadowSway {
            0%, 100% { transform: rotate(-1deg) translateY(0px); }
            50% { transform: rotate(1deg) translateY(-2px); }
        }

        .shadow-sway {
            animation: shadowSway 5s ease-in-out infinite;
        }

        /* 浮遊する不穏な塵・粒子 */
        @keyframes floatDust {
            0% { transform: translateY(105vh) scale(0.6); opacity: 0; }
            20% { opacity: 0.4; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
        }

        .dust-dot {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 40, 40, 0.7) 0%, rgba(0, 0, 0, 0) 70%);
            animation: floatDust linear infinite;
        }

        .blink-alert {
            animation: blinkAnim 2s infinite;
        }
        @keyframes blinkAnim {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body class="relative">

    <!-- ========================================================
         🏚️ 背景：赤い月 ＆ 廃校 ＆ 遠くの闇に潜む極小の影（ネタバレ防止）
         ======================================================== -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        
        <!-- 不気味に滲む赤い月 -->
        <div class="absolute top-12 left-1/2 -translate-x-1/2 w-48 h-48 sm:w-64 sm:h-64 rounded-full bg-gradient-to-b from-red-950/40 via-red-900/20 to-transparent blur-2xl opacity-60"></div>

        <!-- 廃校の校舎シルエット（奥） -->
        <svg class="absolute bottom-0 left-0 w-full h-64 sm:h-80 text-[#090e0b] opacity-80" viewBox="0 0 1000 350" preserveAspectRatio="none" fill="currentColor">
            <!-- 時計塔・本館 -->
            <rect x="420" y="80" width="160" height="270" />
            <polygon points="420,80 500,20 580,80" />
            <circle cx="500" cy="70" r="16" fill="#140202" />
            <!-- 東館・西館 -->
            <rect x="150" y="140" width="270" height="210" />
            <rect x="580" y="140" width="270" height="210" />
            <!-- 屋上フェンス・アンテナ -->
            <line x1="150" y1="130" x2="420" y2="130" stroke="#090e0b" stroke-width="6" />
            <line x1="580" y1="130" x2="850" y2="130" stroke="#090e0b" stroke-width="6" />
            <line x1="500" y1="20" x2="500" y2="0" stroke="#090e0b" stroke-width="4" />
            <!-- 割れた窓（うっすら赤く光る） -->
            <rect x="460" y="140" width="25" height="35" fill="#380000" opacity="0.6" />
            <rect x="515" y="140" width="25" height="35" fill="#380000" opacity="0.4" />
            <rect x="250" y="180" width="30" height="40" fill="#290000" opacity="0.5" />
            <rect x="720" y="180" width="30" height="40" fill="#290000" opacity="0.5" />
            <!-- 荒れ果てた地面 -->
            <path d="M0,320 Q250,300 500,325 T1000,315 L1000,350 L0,350 Z" fill="#060907" />
        </svg>

        <!-- 👤 【ネタバレ防止】遠くの闇・窓辺にわずかに見える極小の人影のみ -->
        <svg class="absolute inset-0 w-full h-full" viewBox="0 0 1000 800" preserveAspectRatio="none">
            <defs>
                <g id="distant-figure">
                    <circle cx="0" cy="-65" r="9" fill="currentColor" />
                    <path d="M -7,-55 C -5,-35 -8,-10 -5,0 L 5,0 C 7,-15 5,-35 7,-55 Z" fill="currentColor" />
                    <path d="M -4,-50 L -18,-42 L -30,-38" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none" />
                    <path d="M 4,-48 L -12,-38 L -24,-30" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none" />
                    <path d="M -4,0 L -8,32 L -12,65" stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none" />
                    <path d="M 4,0 L 8,28 L 6,62" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" fill="none" />
                </g>
            </defs>

            <!-- 遠くの校舎付近にうっすら潜む影のみ（手前の巨大な影は全削除） -->
            <use href="#distant-figure" x="380" y="550" transform="scale(0.28)" class="text-[#0d1410] opacity-40 shadow-sway" />
            <use href="#distant-figure" x="490" y="565" transform="scale(0.24) scaleX(-1)" class="text-[#0d1410] opacity-35 shadow-sway" style="animation-delay: -1.2s;" />
            <use href="#distant-figure" x="620" y="540" transform="scale(0.30)" class="text-[#0d1410] opacity-40 shadow-sway" style="animation-delay: -2.5s;" />
        </svg>

        <!-- 地面を這う不気味な黒煙・霧 -->
        <div class="absolute bottom-0 left-0 w-full h-44 bg-gradient-to-t from-black via-[#020403]/80 to-transparent"></div>
    </div>

    <!-- 浮遊する不穏な粒子コンテナ -->
    <div id="dust-particles" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <!-- ========================================================
         🧪 メインコンテンツ
         ======================================================== -->
    <div class="max-w-4xl mx-auto p-6 relative z-10 mt-6 mb-12">
        
        <!-- ヘッダー・ステータスバー -->
        <div class="flex justify-between items-center border-b border-red-950/80 pb-3 mb-8 text-xs font-mono-tech">
            <a href="index.html" class="text-gray-400 hover:text-white transition flex items-center gap-1">
                &lt; ホームへ戻る
            </a>
            <div class="flex items-center gap-2 blink-alert text-red-500 font-bold tracking-wider">
                <span class="w-2 h-2 rounded-full bg-red-600 inline-block shadow-[0_0_8px_#ff0000]"></span>
                MISSION: SEARCH & RESCUE // 弐ノ壱 廃校
            </div>
        </div>

        <!-- タイトルエリア -->
        <div class="text-center mb-10">
            <p class="text-[11px] font-mono-tech text-red-500/80 tracking-[0.4em] mb-1">FRIEND SEARCH & RESCUE DATABASE</p>
            <h1 class="text-4xl sm:text-5xl font-black text-center text-rescue-glow tracking-widest">
                廃校 親友救出記録
            </h1>
        </div>
        
        <!-- ランキンググリッド -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 relative">
            
            <!-- ① 初回ランキング -->
            <div class="bg-black/85 backdrop-blur-md p-6 rounded-lg shadow-[0_0_30px_rgba(0,0,0,0.9)] border-t-4 border-red-800 border-x border-b border-red-950/80">
                <div class="flex justify-between items-center border-b border-red-950 pb-2 mb-4">
                    <h2 class="text-xl sm:text-2xl font-bold text-red-500 tracking-wider">
                        【初回】親友救出記録
                    </h2>
                    <span class="text-[10px] font-mono-tech text-gray-400 bg-red-950/60 px-2 py-0.5 rounded border border-red-900/60">RESCUE</span>
                </div>
                <ul id="first-timer-list" class="space-y-3">
                    <p class="text-gray-600 text-sm font-mono-tech">SEARCHING RECORDS...</p>
                </ul>
            </div>

            <!-- ② リピーターランキング -->
            <div id="repeater-section" class="bg-black/85 backdrop-blur-md p-6 rounded-lg shadow-[0_0_30px_rgba(255,0,0,0.15)] border-t-4 border-amber-600 border-x border-b border-red-950/80 hidden">
                <div class="flex justify-between items-center border-b border-red-950 pb-2 mb-4">
                    <h2 class="text-xl sm:text-2xl font-bold text-amber-500 tracking-wider">
                        【2回目以降】最速救出隊
                    </h2>
                    <span class="text-[10px] font-mono-tech text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800/60 animate-pulse">EXPERIENCED</span>
                </div>
                <ul id="repeater-list" class="space-y-3"></ul>
            </div>

        </div>

        <div class="mt-12 text-center text-xs font-mono-tech text-gray-700 border-t border-red-950/40 pt-4">
            CONFIDENTIAL // MISSING FRIEND RESCUE OPERATION #2-1
        </div>
    </div>

    <script>
        // 浮遊する不穏な粒子ジェネレーター
        function generateDustDots() {
            const container = document.getElementById("dust-particles");
            const count = 15;
            for (let i = 0; i < count; i++) {
                const el = document.createElement("div");
                el.className = "dust-dot";
                const size = 8 + Math.random() * 18;
                el.style.width = `${size}px`;
                el.style.height = `${size}px`;
                el.style.left = `${Math.random() * 100}%`;
                el.style.animationDuration = `${10 + Math.random() * 14}s`;
                el.style.animationDelay = `${Math.random() * -20}s`;
                container.appendChild(el);
            }
        }
        window.addEventListener('DOMContentLoaded', generateDustDots);

        // Firebase ランキング機能
        db.collection('settings').doc('config').onSnapshot(doc => {
            if(doc.exists && doc.data().showRepeaters) {
                document.getElementById('repeater-section').style.display = 'block';
            } else {
                document.getElementById('repeater-section').style.display = 'none';
            }
        });

        db.collection('times').onSnapshot(snapshot => {
            const firstTimers = {}; 
            const repeaters = {};

            snapshot.forEach(doc => {
                const data = doc.data();
                if(data.count === 1) { 
                    if(!firstTimers[data.teamName] || firstTimers[data.teamName].time > data.time) {
                        firstTimers[data.teamName] = data;
                    }
                } else { 
                    if(!repeaters[data.teamName] || repeaters[data.teamName].time > data.time) {
                        repeaters[data.teamName] = data;
                    }
                }
            });
            renderList('first-timer-list', Object.values(firstTimers), false);
            renderList('repeater-list', Object.values(repeaters), true);
        });

        function renderList(elementId, dataArray, isRepeater) {
            const list = document.getElementById(elementId);
            list.innerHTML = '';
            
            dataArray.sort((a, b) => a.time - b.time).slice(0, 10).forEach((data, index) => {
                const li = document.createElement('li');
                
                if (isRepeater) {
                    li.className = "flex justify-between items-center bg-zinc-950/90 border border-amber-900/40 p-3 rounded text-gray-200 shadow-sm hover:border-amber-600 transition";
                } else {
                    li.className = "flex justify-between items-center bg-zinc-950/90 border border-red-950/60 p-3 rounded text-gray-200 shadow-sm hover:border-red-600 transition";
                }
                
                let rankStyle = "text-xl font-bold font-mono-tech ";
                if(index === 0) rankStyle += "text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.7)]";
                else if(index === 1) rankStyle += "text-gray-300";
                else if(index === 2) rankStyle += "text-amber-600";
                else rankStyle += "text-gray-600";
                
                const countBadge = data.count > 1 
                    ? `<span class="text-xs bg-amber-950/80 border border-amber-600 text-amber-200 px-2 py-0.5 rounded ml-2 font-mono-tech font-bold">RESCUE-${data.count}</span>` 
                    : '';
                
                const timeColor = isRepeater ? "text-amber-400" : "text-red-400";
                
                li.innerHTML = `
                    <div class="flex items-center">
                        <span class="w-8 ${rankStyle}">#${(index + 1).toString().padStart(2, '0')}</span>
                        <span class="font-bold text-base sm:text-lg text-white ml-1">${data.teamName}</span>
                        ${countBadge}
                    </div>
                    <span class="font-mono-tech text-lg sm:text-xl ${timeColor} font-bold tracking-wider drop-shadow-[0_0_6px_currentColor]">
                        ${formatTime(data.time)}
                    </span>
                `;
                list.appendChild(li);
            });

            if(dataArray.length === 0) {
                list.innerHTML = '<p class="text-gray-700 text-sm font-mono-tech">NO RESCUE RECORDED</p>';
            }
        }

        function formatTime(ms) {
            const m = Math.floor(ms / 60000).toString().padStart(2, '0');
            const s = Math.floor((ms % 60000) / 1000).toString().padStart(2, '0');
            const c = Math.floor((ms % 1000) / 10).toString().padStart(2, '0');
            return `${m}:${s}.${c}`;
        }
    </script>
</body>
</html>
