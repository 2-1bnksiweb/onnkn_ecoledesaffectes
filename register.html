<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンバー登録</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-2">チームへの参加登録</h1>
        <p id="team-display" class="text-center font-bold text-xl mb-6 bg-blue-50 py-2 rounded">読込中...</p>
        
        <div id="login-section" class="space-y-4">
            <p class="text-sm text-gray-600 text-center mb-4">本人確認と過去の参加歴確認のため、ログインをお願いします。</p>
            
            <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center bg-white border-2 border-gray-300 text-gray-700 py-3 rounded font-bold hover:bg-gray-50 transition">
                <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Googleでログイン
            </button>
            <button onclick="showPhoneForm()" class="w-full bg-green-500 text-white py-3 rounded font-bold hover:bg-green-600 transition">📱 電話番号 (SMS) でログイン</button>
        </div>

        <div id="phone-section" class="hidden">
            <h2 class="font-bold text-gray-700 mb-2">電話番号を入力</h2>
            <input type="tel" id="phone-number" placeholder="09012345678 (ハイフンなし)" class="w-full border p-3 rounded bg-gray-50 mb-4">
            <button onclick="sendSMS()" class="w-full bg-green-500 text-white py-3 rounded font-bold hover:bg-green-600">SMSに認証コードを送信</button>
            <button onclick="cancelLogin()" class="w-full text-sm text-gray-500 mt-4">戻る</button>
        </div>

        <div id="code-section" class="hidden">
            <h2 class="font-bold text-gray-700 mb-2">SMSに届いた6桁のコードを入力</h2>
            <input type="number" id="sms-code" placeholder="123456" class="w-full border p-3 rounded bg-gray-50 mb-4 text-center tracking-widest text-xl">
            <button onclick="verifyCode()" class="w-full bg-blue-600 text-white py-3 rounded font-bold hover:bg-blue-700">認証する</button>
        </div>
        <div id="recaptcha-container"></div>

        <form id="profile-form" onsubmit="submitMember(event)" class="hidden">
            <div class="mb-4 text-center">
                <span class="inline-block bg-green-100 text-green-800 text-sm px-3 py-1 rounded-full font-bold">✅ 認証完了</span>
            </div>
            <div class="mb-4">
                <label class="block font-bold mb-1">お名前 (フルネーム)</label>
                <input type="text" id="m-name" required class="w-full border p-2 rounded bg-gray-50">
            </div>
            <div class="mb-6">
                <label class="block font-bold mb-1">学年 (例: 1年, 先生)</label>
                <input type="text" id="m-grade" required class="w-full border p-2 rounded bg-gray-50">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded font-bold hover:bg-blue-700">このチームに登録する</button>
        </form>

        <div id="success-msg" class="hidden text-center mt-6">
            <h2 class="text-2xl font-bold text-green-600 mb-2">登録完了！</h2>
            <p class="mb-6">他のメンバーも登録し終えたら、下のボタンからゲーム画面へ進んで待機してください。</p>
            <button id="go-play-btn" class="w-full bg-red-600 text-white py-4 rounded-lg font-bold text-xl shadow-lg hover:bg-red-700 animate-pulse">謎解き・タイマー画面へ進む</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const teamId = urlParams.get('teamId');
        let currentTeamName = "";
        let currentUserUid = "";

        db.collection('teams').doc(teamId).get().then(doc => {
            if(doc.exists) {
                currentTeamName = doc.data().teamName;
                document.getElementById('team-display').innerText = `チーム名: ${currentTeamName}`;
            } else {
                alert("無効なQRコードです。");
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider).then((result) => {
                currentUserUid = result.user.uid;
                if(result.user.displayName) document.getElementById('m-name').value = result.user.displayName;
                showProfileForm();
            }).catch((error) => {
                alert("ログインに失敗しました: " + error.message);
            });
        }

        function showPhoneForm() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('phone-section').style.display = 'block';
            if(!window.recaptchaVerifier) {
                window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });
            }
        }
        function cancelLogin() {
            document.getElementById('phone-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        }
        function sendSMS() {
            let phone = document.getElementById('phone-number').value;
            if(!phone) return alert("電話番号を入力してください");
            if(phone.startsWith('0')) phone = '+81' + phone.substring(1);

            firebase.auth().signInWithPhoneNumber(phone, window.recaptchaVerifier)
            .then((confirmationResult) => {
                window.confirmationResult = confirmationResult;
                document.getElementById('phone-section').style.display = 'none';
                document.getElementById('code-section').style.display = 'block';
            }).catch(() => {
                alert("SMS送信エラー。電話番号が正しいか確認してください。");
                window.recaptchaVerifier.render().then(w => grecaptcha.reset(w));
            });
        }
        function verifyCode() {
            const code = document.getElementById('sms-code').value;
            if(!code) return;
            window.confirmationResult.confirm(code).then((result) => {
                currentUserUid = result.user.uid;
                document.getElementById('code-section').style.display = 'none';
                showProfileForm();
            }).catch(() => alert("認証コードが間違っています。"));
        }

        function showProfileForm() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('phone-section').style.display = 'none';
            document.getElementById('code-section').style.display = 'none';
            document.getElementById('profile-form').style.display = 'block';
        }

        async function submitMember(e) {
            e.preventDefault();
            e.target.querySelector('button[type="submit"]').disabled = true;

            const pastSnapshot = await db.collection('members').where('uid', '==', currentUserUid).get();
            let isExperienced = false;
            let pastTeams = [];
            
            pastSnapshot.forEach(doc => {
                if(doc.data().teamId !== teamId) {
                    isExperienced = true;
                    pastTeams.push(doc.data().teamName);
                }
            });

            await db.collection('members').add({
                teamId: teamId,
                teamName: currentTeamName,
                uid: currentUserUid,
                name: document.getElementById('m-name').value,
                grade: document.getElementById('m-grade').value,
                isExperienced: isExperienced,
                pastTeams: pastTeams,
                registeredAt: new Date()
            });

            document.getElementById('profile-form').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';

            document.getElementById('go-play-btn').onclick = () => {
                window.location.href = `play.html?teamId=${teamId}`;
            };
        }
    </script>
</body>
</html>
