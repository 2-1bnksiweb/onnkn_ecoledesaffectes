<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    
    <title>恐怖の廃校 - HOME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&display=swap" rel="stylesheet">
    
    <style>
        /* 怨霊フォントの読み込み */
        @font-face {
            font-family: 'Onryou';
            src: url('onryou.ttf') format('truetype');
        }

        body { 
            font-family: 'Onryou', 'Shippori Mincho', serif; 
            background-color: #050505; 
            color: #e5e5e5; 
            overflow-x: hidden; 
            min-height: 100dvh; 
        }

        #opening { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            overflow: hidden; display: flex; flex-direction: column; 
        }
        
        .handprint { 
            position: absolute; 
            opacity: 0; 
            transform: scale(0.5); 
            animation: stamp 0.15s forwards; 
            pointer-events: none;
        }
        @keyframes stamp { to { opacity: 0.95; transform: scale(1); } }
        
        #blood-screen { 
            position: absolute; inset: 0; background: #880000; 
            opacity: 0; transition: opacity 0.3s; z-index: 10000; 
            pointer-events: none;
        }

        .blood-splatter { 
            position: absolute; 
            background-image: radial-gradient(circle, #5a0000 0%, transparent 60%); 
            opacity: 0.25; border-radius: 50%; pointer-events: none; z-index: -1; 
        }
        .shadow-red { text-shadow: 0 0 15px #ff0000; }
        .shadow-btn { box-shadow: 0 4px 15px rgba(136, 0, 0, 0.5); }
    </style>
</head>
<body class="relative">

    <div id="opening">
        <div id="blood-screen"></div>
    </div>

    <div id="main-content" class="max-w-md mx-auto p-6 min-h-[100dvh] relative opacity-0 transition-opacity duration-1000 flex flex-col justify-center">
        
        <div class="blood-splatter w-64 h-64 top-10 -left-10"></div>
        <div class="blood-splatter w-80 h-80 bottom-10 -right-20"></div>

        <header class="flex justify-between items-center border-b border-red-900 pb-3 mb-8 text-gray-400 font-sans absolute top-6 left-6 right-6">
            <span class="tracking-widest">2-1 教室発表</span>
            <button onclick="toggleMenu()" class="text-3xl hover:text-white">☰</button>
        </header>

        <div id="nav-menu" class="hidden flex-col bg-gray-900 p-4 rounded border border-red-900 mb-6 space-y-3 font-sans text-sm absolute top-20 right-6 z-50">
            <a href="timeattack.html" class="text-red-400 hover:text-red-300">✝ スタッフ用: タイム計測＆謎発動</a>
            <a href="admin.html" class="text-red-400 hover:text-red-300">✝ 管理者設定</a>
        </div>

        <div class="text-center mb-10 mt-16">
            <div class="flex justify-center space-x-6 text-xs text-red-600 mb-2 tracking-widest font-bold font-sans">
                <span>おののけ</span>
                <span>エコールデサフェクテ</span>
            </div>
            <h1 class="text-5xl font-black text-white tracking-widest shadow-red mb-2" id="story-title">恐怖の廃校</h1>
        </div>

        <div class="mb-10 text-center flex-1">
            <p class="text-red-500 mb-4 text-lg">〜 あらすじ 〜</p>
            <svg class="w-full h-4 text-red-900 mb-4" fill="none" stroke="currentColor" viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M0,5 Q25,0 50,5 T100,5 T150,5 T200,5" stroke-width="1"></path></svg>
            
            <p id="story-text" class="text-xl text-gray-300 leading-loose px-4">
                読込中...
            </p>
            
            <svg class="w-full h-4 text-red-900 mt-4" fill="none" stroke="currentColor" viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M0,5 Q25,10 50,5 T100,5 T150,5 T200,5" stroke-width="1"></path></svg>
        </div>

        <div class="mb-8 text-center px-2">
            <h2 class="text-2xl text-red-500 mb-4 tracking-widest font-bold">予約</h2>
            <p class="text-sm text-gray-400 mb-1">下のボタンから予約をすることができます。</p>
            <p class="text-sm text-gray-400 mb-3">前日でも当日でも予約可能です。</p>
            <a href="#" class="inline-block mb-4 text-sm text-blue-500 hover:text-blue-400 underline decoration-blue-500">詳しいやり方、注意点はこちらから</a>
            
            <a href="ticket.html" class="block w-full py-4 bg-red-900 border border-red-700 text-white text-2xl hover:bg-red-800 transition tracking-widest shadow-btn">
                予約 はこちらから
            </a>
        </div>

        <div class="mb-4 text-center px-2">
            <h2 class="text-2xl text-red-500 mb-4 tracking-widest font-bold">ランキング</h2>
            <p class="text-sm text-gray-400 mb-4">上位TOP3まで表示されます</p>
            <a href="ranking.html" class="block w-full py-4 bg-gray-800 border border-gray-600 text-white text-xl hover:bg-gray-700 transition tracking-widest">
                ランキングはこちらから
            </a>
        </div>
    </div>

    <script>
        try {
            db.collection('settings').doc('config').onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    document.getElementById('story-title').innerText = data.storyTitle || "恐怖の廃校";
                    document.getElementById('story-text').innerHTML = (data.storyText || "怨念渦巻く廃校に迷い込んでしまったあなた達...。\n制限時間内に謎を解き、最速タイムで脱出せよ！").replace(/\n/g, '<br>');
                }
            });
        } catch (e) {
            console.error("Firebase読み込みスキップ");
        }

        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        // ==========================================
        // 🩸 血の手形＆垂れるオープニングアニメーション
        // ==========================================
        window.onload = () => {
            
            if (sessionStorage.getItem('opened')) {
                document.getElementById('opening').style.display = 'none';
                document.getElementById('main-content').style.opacity = '1';
                return;
            }
            sessionStorage.setItem('opened', 'true');

            const opening = document.getElementById('opening');
            const bloodScreen = document.getElementById('blood-screen');
            const mainContent = document.getElementById('main-content');
            
            let count = 0;
            const maxCount = 40; 
            let delay = 400;

            // リアルな血の手形（指・手のひら・垂れる血・飛び散る飛沫）のSVGデータ群
            const handSvgs = [
                // パターン1: 垂れる血つき手形
                `<svg viewBox="0 0 200 260" fill="#880000" style="filter: drop-shadow(0 0 8px #ff0000); width:100%; height:100%;">
                    <path d="M68,95 Q70,40 76,20 Q82,10 88,20 Q92,40 92,95 M96,90 Q102,28 108,8 Q114,-2 120,8 Q125,28 124,90 M128,95 Q134,35 140,16 Q146,6 152,16 Q156,35 154,95 M158,110 Q165,55 170,38 Q176,28 182,38 Q184,55 180,115 M42,125 Q24,105 18,98 Q10,92 15,108 Q26,130 48,150 M56,115 C46,145 46,185 72,205 C108,230 156,220 176,190 C192,160 186,125 166,115 Z" />
                    <!-- 垂れる血 -->
                    <path d="M72,205 Q70,235 68,255 M118,215 Q120,240 118,250 M160,195 Q164,225 162,245" stroke="#880000" stroke-width="4.5" stroke-linecap="round" fill="none" />
                    <!-- 飛沫 -->
                    <circle cx="28" cy="180" r="3.5" /><circle cx="188" cy="78" r="3" /><circle cx="55" cy="240" r="2.5" />
                </svg>`,
                // パターン2: べったりした濃い手形
                `<svg viewBox="0 0 200 260" fill="#990000" style="filter: drop-shadow(0 0 8px #ff0000); width:100%; height:100%;">
                    <path d="M64,98 Q66,35 74,15 Q82,5 88,15 Q94,35 94,98 M98,92 Q104,22 110,3 Q118,-4 122,3 Q128,22 126,92 M130,98 Q136,30 142,12 Q148,2 154,12 Q158,30 156,98 M160,112 Q168,48 174,32 Q180,22 186,32 Q188,48 182,118 M38,128 Q20,105 15,96 Q8,90 12,106 Q22,130 44,152 M52,118 C42,148 42,190 68,210 C104,235 158,225 178,195 C194,162 188,128 168,118 Z" />
                    <path d="M88,210 Q85,240 82,258 M142,215 Q145,235 140,250" stroke="#990000" stroke-width="5" stroke-linecap="round" fill="none" />
                </svg>`
            ];

            function showHand() {
                const hand = document.createElement('div');
                hand.className = 'handprint';
                
                // パターンをランダムで選んでSVGを描画（画像ファイル不要！）
                hand.innerHTML = handSvgs[Math.floor(Math.random() * handSvgs.length)];
                
                // 大きさを 150px 〜 400px で超バラバラに
                const size = 150 + (Math.random() * 250); 
                hand.style.width = `${size}px`;
                hand.style.height = `${size * 1.3}px`;
                
                // 角度を 0度 〜 360度 で完全ランダム
                const rotate = Math.random() * 360; 
                
                // 画面全体にはみ出るように配置
                const x = -15 + (Math.random() * 110); 
                const y = -15 + (Math.random() * 110); 
                
                hand.style.left = `${x}%`;
                hand.style.top = `${y}%`;
                hand.style.transform = `scale(0.5) rotate(${rotate}deg)`;
                
                opening.appendChild(hand);
                count++;
                
                if (count < maxCount) {
                    delay = Math.max(20, delay * 0.90); 
                    setTimeout(showHand, delay);
                } else {
                    setTimeout(() => {
                        bloodScreen.style.opacity = '1';
                        setTimeout(() => {
                            opening.style.transition = "transform 1.2s cubic-bezier(0.5, 0, 1, 0.5), border-radius 1.2s";
                            opening.style.transform = "translateY(100%)";
                            opening.style.borderTopLeftRadius = "50% 15%";
                            opening.style.borderTopRightRadius = "50% 15%";
                            
                            mainContent.style.opacity = '1';
                            
                            setTimeout(() => { opening.style.display = 'none'; }, 1200);
                        }, 500);
                    }, 300);
                }
            }
            
            setTimeout(showHand, 300);
        };
    </script>
</body>
</html>
