<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整理券発行 (代表者用)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-3xl font-bold text-center mb-6">整理券の取得</h1>
        
        <div id="ticket-section">
            <div class="mb-6">
                <label class="block font-bold mb-2">チーム名</label>
                <input type="text" id="team-name" class="w-full border p-3 rounded" placeholder="例: 脱出マスターズ" required>
            </div>
            <div class="mb-6">
                <label class="block font-bold mb-2">参加人数</label>
                <input type="number" id="member-count" class="w-full border p-3 rounded" value="1" min="1" required>
            </div>

            <h2 class="font-bold mb-2">ご希望の時間帯を選択</h2>
            <div id="slots-container" class="space-y-3 mb-6">読み込み中...</div>
            
            <div id="walkin-container" class="mt-6 hidden border-t pt-4">
                <button onclick="issueTicket('walkin', '当日枠')" class="w-full bg-red-500 text-white py-3 rounded hover:bg-red-600 font-bold">急に来た方用 (当日枠)で発行</button>
            </div>
        </div>

        <div id="qr-section" class="hidden text-center">
            <h2 class="text-2xl font-bold text-green-600 mb-4">整理券を確保しました！</h2>
            <p class="mb-4 font-bold text-red-500">※まだ予約は完了していません。</p>
            <p class="mb-4 text-left bg-gray-100 p-4 rounded text-sm">
                このQRコードをメンバー全員に見せて読み取ってもらい、各自のスマホから個人情報を登録させてください。全員の登録が完了した時点で受付可能となります。
            </p>
            <div id="qrcode" class="flex justify-center mb-4"></div>
            <p class="text-sm text-gray-500 mb-6 break-all" id="qr-url"></p>
            <a href="index.html" class="text-blue-500 hover:underline">ホームへ戻る</a>
        </div>
    </div>

    <script>
        db.collection('settings').doc('config').onSnapshot(doc => {
            if(doc.exists && doc.data().walkInActive) {
                document.getElementById('walkin-container').style.display = 'block';
            }
        });

        db.collection('slots').orderBy('time').onSnapshot(snapshot => {
            const container = document.getElementById('slots-container');
            container.innerHTML = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                const available = data.capacity - data.booked;
                const btn = document.createElement('button');
                btn.className = `w-full p-4 rounded text-left font-bold ${available <= 0 ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-blue-100 hover:bg-blue-200 text-blue-800'}`;
                btn.innerHTML = `${data.time} (空き: ${available}人)`;
                btn.disabled = available <= 0;
                btn.onclick = () => issueTicket(doc.id, data.time, available);
                container.appendChild(btn);
            });
        });

        async function issueTicket(slotId, timeLabel, available = 999) {
            const teamName = document.getElementById('team-name').value;
            const count = parseInt(document.getElementById('member-count').value);

            if(!teamName) return alert("チーム名を入力してください");
            if(count > available) return alert("空き枠が足りません");

            const lastBooked = localStorage.getItem('lastBookedTime');
            if(lastBooked && (Date.now() - lastBooked < 60 * 60 * 1000)) {
                return alert("一定時間内に複数回の整理券取得はできません。");
            }

            try {
                if (slotId !== 'walkin') {
                    const slotRef = db.collection('slots').doc(slotId);
                    await db.runTransaction(async (transaction) => {
                        const doc = await transaction.get(slotRef);
                        const newBooked = doc.data().booked + count;
                        if (newBooked > doc.data().capacity) throw "満員エラー";
                        transaction.update(slotRef, { booked: newBooked });
                    });
                }
                
                const teamDoc = await db.collection('teams').add({
                    teamName: teamName,
                    timeLabel: timeLabel,
                    expectedCount: count,
                    status: 'registered',
                    createdAt: new Date()
                });

                localStorage.setItem('lastBookedTime', Date.now());

                document.getElementById('ticket-section').style.display = 'none';
                document.getElementById('qr-section').style.display = 'block';
                
                const registerUrl = `${window.location.origin}${window.location.pathname.replace('ticket.html', 'register.html')}?teamId=${teamDoc.id}`;
                new QRCode(document.getElementById("qrcode"), { text: registerUrl, width: 200, height: 200 });
                document.getElementById('qr-url').innerText = registerUrl;

            } catch (e) {
                alert("予約に失敗しました。他の人が先に枠を取った可能性があります。");
            }
        }
    </script>
</body>
</html>
