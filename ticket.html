<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <title>整理券発行 - 恐怖の廃校</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="firebase-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;900&family=Yuji+Boku&display=swap" rel="stylesheet">
    <style>
        @font-face { font-family: 'OnryouFont'; src: url('home/onryu.ttf') format('truetype'), url('./home/onryu.ttf') format('truetype'), url('home/onryou.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
        *, *::before, *::after, body, h1, h2, h3, p, span, a, button, input, div, header, rt, ruby, select { font-family: 'OnryouFont', 'Yuji Boku', 'Shippori Mincho', serif !important; }
        body { background-color: #030303; color: #d1d1d1; overflow-x: hidden; min-height: 100dvh; }
        .text-blood-dark { background: linear-gradient(180deg, #ff1a1a 0%, #b30000 40%, #4d0000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(2px 2px 2px #000000) drop-shadow(0 0 10px rgba(0,0,0,0.9)); }
        .shadow-btn { box-shadow: 0 4px 15px rgba(80, 0, 0, 0.7); }
    </style>
</head>
<body class="relative">

    <div id="spider-web-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-80"></div>

    <div class="max-w-2xl mx-auto p-6 relative z-20 mt-4 mb-12">
        <header class="flex justify-between items-center border-b border-red-950 pb-3 mb-8 text-gray-300 relative z-30" style="text-shadow: 0 2px 4px #000;">
            <span class="tracking-widest text-lg">弐ノ壱 教室発表</span>
            <button id="menu-btn" onclick="toggleMenu()" class="text-4xl hover:text-red-500 drop-shadow-md transition-transform duration-300 w-10 h-10 flex items-center justify-center">☰</button>
        </header>

        <div id="nav-menu" class="hidden flex-col bg-gray-950/95 backdrop-blur p-4 rounded border border-red-950 mb-6 space-y-4 text-xl absolute top-20 right-6 z-50 shadow-2xl">
            <a href="index.html" class="text-gray-400 hover:text-white border-b border-red-900 pb-2">ホームへ戻る</a>
            <a href="ranking.html" class="text-red-500 hover:text-red-300 border-b border-red-900 pb-2">ランキングを見る</a>
        </div>

        <div class="bg-gray-950/90 border border-red-950 p-8 rounded-lg shadow-2xl relative backdrop-blur-sm mt-6">
            <h1 class="text-3xl sm:text-4xl font-bold text-center mb-6 text-blood-dark tracking-widest">整理券発行 (代表者)</h1>
            
            <div id="ticket-section">
                <!-- 【変更点】代表者がチーム名と人数だけ入力する -->
                <div class="mb-4">
                    <label class="block font-bold mb-1 text-gray-300">チーム名</label>
                    <input type="text" id="team-name" class="w-full border border-red-950 bg-gray-900 text-gray-200 p-3 rounded focus:outline-none focus:border-red-700" placeholder="例: 恐怖の2年生" required>
                </div>
                <div class="mb-8">
                    <label class="block font-bold mb-1 text-gray-300">参加人数</label>
                    <input type="number" id="member-count" class="w-full border border-red-950 bg-gray-900 text-gray-200 p-3 rounded focus:outline-none focus:border-red-700" value="1" min="1" required>
                </div>

                <h2 class="text-xl font-semibold mb-4 text-blood-dark border-b border-red-950 pb-2">ご希望の時間帯を選択</h2>
                <div id="slots-container" class="space-y-3"><p class="text-gray-500">読込中...</p></div>
                <div id="walkin-container" class="mt-6 hidden border-t border-red-950 pt-4">
                    <button onclick="issueTicket('walkin', '当日枠', 99)" class="w-full bg-red-900 border border-red-700 text-white py-3 rounded hover:bg-red-800 font-bold shadow-btn tracking-widest">当日枠の整理券を発行する</button>
                </div>
            </div>

            <!-- 【変更点】確保後にメンバー各自に登録させるためのQRコードを表示 -->
            <div id="qr-section" class="hidden text-center">
                <h2 class="text-2xl font-bold text-red-500 mb-4" style="text-shadow: 0 0 10px rgba(255,0,0,0.5);">整理券の枠を確保しました</h2>
                <p class="mb-4 text-white font-bold text-lg border-b border-red-900 pb-2">※まだ予約は完了していません！</p>
                <p class="mb-6 text-gray-300 text-sm leading-relaxed">
                    このQRコードを<span class="text-red-400 font-bold">メンバー全員</span>に読み取ってもらい、各自のスマホから個人情報を登録させてください。<br>
                    全員の登録が完了した時点で受付可能となります。
                </p>
                <div id="qrcode" class="flex justify-center mb-6 p-4 bg-white rounded-lg inline-block shadow-lg"></div>
                <a href="index.html" class="inline-block px-8 py-4 bg-[#260101] border border-[#520202] text-blood-dark font-bold text-xl rounded shadow-btn hover:bg-black transition tracking-widest">ホームに戻る</a>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            const btn = document.getElementById('menu-btn');
            if(menu) { 
                if(menu.classList.contains('hidden')) { menu.classList.remove('hidden'); menu.classList.add('flex'); btn.innerText = '✕'; btn.style.transform = 'rotate(90deg)'; } 
                else { menu.classList.add('hidden'); menu.classList.remove('flex'); btn.innerText = '☰'; btn.style.transform = 'rotate(0deg)'; }
            }
        }

        // 蜘蛛の巣ジェネレーター
        function buildSpiderWebs() {
            const container = document.getElementById("spider-web-container");
            const svgNs = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNs, "svg");
            svg.setAttribute("width", "100%"); svg.setAttribute("height", "100%");
            container.appendChild(svg);
            const width = window.innerWidth; const height = window.innerHeight;
            const cx = width; const cy = 0; const maxR = Math.min(width, height) * 0.9; 
            const rayCount = 12 + Math.floor(Math.random() * 4); 
            const angles = [];
            for (let i = 0; i < rayCount; i++) { angles.push(Math.PI / 2 + (Math.PI / 2) * (i / (rayCount - 1)) + (Math.random() * 0.06 - 0.03)); }
            const rays = [];
            angles.forEach(a => {
                const r = maxR * (0.6 + Math.random() * 0.4); const x = cx + Math.cos(a) * r; const y = cy + Math.sin(a) * r;
                const line = document.createElementNS(svgNs, "line");
                line.setAttribute("x1", cx); line.setAttribute("y1", cy); line.setAttribute("x2", x); line.setAttribute("y2", y);
                line.setAttribute("stroke", "rgba(160, 160, 160, 0.4)"); line.setAttribute("stroke-width", "1.2");
                svg.appendChild(line);
                rays.push({ angle: a, r: r });
            });
            const rings = 12 + Math.floor(Math.random() * 6);
            for (let rIdx = 1; rIdx <= rings; rIdx++) {
                const rBase = (maxR / rings) * rIdx;
                for (let i = 0; i < rayCount - 1; i++) {
                    if (Math.random() < 0.1) continue; 
                    const r1 = rBase * (0.95 + Math.random() * 0.1); const r2 = rBase * (0.95 + Math.random() * 0.1);
                    if (r1 > rays[i].r || r2 > rays[i+1].r) continue;
                    const x1 = cx + Math.cos(rays[i].angle) * r1; const y1 = cy + Math.sin(rays[i].angle) * r1;
                    const x2 = cx + Math.cos(rays[i+1].angle) * r2; const y2 = cy + Math.sin(rays[i+1].angle) * r2;
                    const midAngle = (rays[i].angle + rays[i+1].angle) / 2; const midR = (r1 + r2) / 2 * 0.94; 
                    const mx = cx + Math.cos(midAngle) * midR; const my = cy + Math.sin(midAngle) * midR;
                    const path = document.createElementNS(svgNs, "path");
                    path.setAttribute("d", `M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`); path.setAttribute("fill", "none"); path.setAttribute("stroke", "rgba(160, 160, 160, 0.5)"); path.setAttribute("stroke-width", "0.8");
                    svg.appendChild(path);
                }
            }
        }
        window.addEventListener('DOMContentLoaded', buildSpiderWebs);

        async function loadSlots() {
            const container = document.getElementById('slots-container'); container.innerHTML = '';
            const settingsDoc = await db.collection('settings').doc('config').get();
            if(settingsDoc.exists && settingsDoc.data().walkInActive) document.getElementById('walkin-container').style.display = 'block';

            db.collection('slots').onSnapshot(snapshot => {
                container.innerHTML = '';
                let slots = [];
                snapshot.forEach(doc => slots.push({ id: doc.id, ...doc.data() }));
                
                slots.sort((a, b) => {
                    const dayA = a.day || 1; const dayB = b.day || 1;
                    if (dayA !== dayB) return dayA - dayB;
                    return (a.time || "").localeCompare(b.time || "");
                });

                slots.forEach(data => {
                    const btn = document.createElement('button'); 
                    const isFull = Number(data.booked) >= Number(data.capacity);
                    const available = Number(data.capacity) - Number(data.booked);
                    
                    btn.className = `w-full p-4 rounded text-left font-bold border transition tracking-widest ${isFull ? 'bg-gray-900 text-gray-600 border-gray-800 cursor-not-allowed' : 'bg-red-950/40 hover:bg-red-900/60 text-red-200 border-red-900/50 shadow-sm'}`;
                    
                    const dayLabel = data.day ? `<span class="bg-red-900 text-red-200 px-2 py-0.5 rounded text-xs mr-2 font-bold">${data.day}日目</span>` : "";
                    btn.innerHTML = `${dayLabel}${data.time} (空き: ${available}人)`; 
                    
                    btn.disabled = isFull; 
                    btn.onclick = () => issueTicket(data.id, `${data.day ? data.day+'日目 ' : ''}${data.time}`, available);
                    container.appendChild(btn);
                });
                if(slots.length === 0) container.innerHTML = '<p class="text-gray-500">現在公開されている時間枠はありません。</p>';
            });
        }

        async function issueTicket(slotId, timeLabel, available = 99) {
            const teamName = document.getElementById('team-name').value;
            const count = parseInt(document.getElementById('member-count').value);
            
            if(!teamName) return alert("チーム名を入力してください");
            if(count > available) return alert("この枠の空き人数が足りません");

            if (slotId !== 'walkin') {
                const slotRef = db.collection('slots').doc(slotId);
                try {
                    await db.runTransaction(async (t) => {
                        const doc = await t.get(slotRef); 
                        const newBooked = Number(doc.data().booked) + count;
                        if (newBooked > Number(doc.data().capacity)) throw "他の人が先に枠を取り満員になりました"; 
                        t.update(slotRef, { booked: newBooked });
                    });
                } catch (e) { alert(e); return; }
            }
            
            // チーム情報を枠の数だけFirestoreに確保
            const teamDoc = await db.collection('teams').add({
                teamName: teamName,
                timeLabel: timeLabel,
                expectedCount: count,
                status: 'registered',
                timerState: 'ready',
                accumulatedTime: 0,
                createdAt: new Date()
            });

            document.getElementById('ticket-section').style.display = 'none'; 
            document.getElementById('qr-section').style.display = 'block';
            
            // メンバーが各々登録するページ (register.html) へのQRを生成
            const registerUrl = `${window.location.origin}${window.location.pathname.replace('ticket.html', 'register.html')}?teamId=${teamDoc.id}`;
            new QRCode(document.getElementById("qrcode"), { text: registerUrl, width: 200, height: 200 });
        }

        loadSlots();
    </script>
</body>
</html>
