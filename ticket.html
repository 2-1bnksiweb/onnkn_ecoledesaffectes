<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    
    <title>整理券発行＆チーム登録 - 恐怖の廃校</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="firebase-config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;900&family=Yuji+Boku&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'OnryouFont';
            src: url('home/onryu.ttf') format('truetype'),
                 url('./home/onryu.ttf') format('truetype'),
                 url('home/onryou.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        *, *::before, *::after, body, h1, h2, h3, p, span, a, button, input, div, header, rt, ruby, select { 
            font-family: 'OnryouFont', 'Yuji Boku', 'Shippori Mincho', serif !important; 
        }

        body { 
            background-color: #030303; 
            color: #d1d1d1; 
            overflow-x: hidden; 
            min-height: 100dvh; 
        }

        .text-blood-dark {
            background: linear-gradient(180deg, #ff1a1a 0%, #b30000 40%, #4d0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 2px #000000) drop-shadow(0 0 10px rgba(0,0,0,0.9));
        }
        
        .sub-blood-dark {
            color: #d90000;
            text-shadow: 1px 1px 2px #000000, 0 0 8px rgba(0,0,0,0.8);
        }

        .shadow-btn { box-shadow: 0 4px 15px rgba(80, 0, 0, 0.7); }
    </style>
</head>
<body class="relative">

    <!-- 🩸 血の装飾群（背景 z-0） -->
    <svg class="fixed top-0 left-0 w-full pointer-events-none z-0 h-44 sm:h-64 opacity-75" viewBox="0 0 1000 270" preserveAspectRatio="none">
        <defs>
            <linearGradient id="realBloodGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#450000" />
                <stop offset="45%" stop-color="#780202" />
                <stop offset="90%" stop-color="#940303" />
            </linearGradient>
        </defs>
        <path d="M0,0 L1000,0 L1000,25 C985,25 980,125 970,125 C960,125 955,35 945,35 C935,35 930,200 920,200 C910,200 905,55 895,55 C885,55 880,110 870,110 C860,110 855,40 845,40 C835,40 830,230 818,230 C808,230 802,45 790,45 C775,45 770,150 760,150 C750,150 745,30 730,30 C715,30 710,180 700,180 C690,180 685,50 670,50 C655,50 650,120 640,120 C630,120 625,35 610,35 C595,35 590,255 575,255 C562,255 558,65 540,65 C525,65 520,160 510,160 C500,160 495,40 480,40 C465,40 460,220 445,220 C435,220 430,55 415,55 C400,55 395,140 385,140 C375,140 370,30 355,30 C340,30 335,190 325,190 C315,190 310,45 295,45 C280,45 275,110 265,110 C255,110 250,35 235,35 C220,35 215,240 200,240 C190,240 185,60 170,60 C155,60 150,150 140,150 C130,150 125,30 110,30 C95,30 90,200 80,200 C70,200 65,50 50,50 C35,50 30,120 20,120 C10,120 5,25 0,25 Z" fill="url(#realBloodGrad)" />
    </svg>
    <svg class="fixed top-0 left-0 w-56 h-56 pointer-events-none z-0 opacity-40" viewBox="0 0 200 200">
        <path d="M0,0 L90,0 C75,25 100,50 75,65 C55,80 45,110 20,90 C5,80 0,100 0,100 Z" fill="#660101" />
        <g fill="#7a0202"><circle cx="110" cy="25" r="4.5" /><circle cx="130" cy="38" r="2.5" /><circle cx="95" cy="85" r="5" /></g>
    </svg>
    <svg class="fixed top-0 right-0 w-56 h-56 pointer-events-none z-0 opacity-40" viewBox="0 0 200 200" style="transform: scaleX(-1);">
        <path d="M0,0 L90,0 C75,25 100,50 75,65 C55,80 45,110 20,90 C5,80 0,100 0,100 Z" fill="#660101" />
        <g fill="#7a0202"><circle cx="110" cy="25" r="4.5" /><circle cx="130" cy="38" r="2.5" /><circle cx="95" cy="85" r="5" /></g>
    </svg>
    <svg class="fixed bottom-0 left-0 w-60 h-60 pointer-events-none z-0 opacity-40" viewBox="0 0 200 200" style="transform: scaleY(-1);">
        <path d="M0,0 L100,0 C80,30 110,55 85,75 C60,95 50,125 25,105 C5,95 0,115 0,115 Z" fill="#5c0101" />
        <g fill="#7a0202"><circle cx="120" cy="30" r="5" /><circle cx="105" cy="95" r="5.5" /></g>
    </svg>
    <svg class="fixed bottom-0 right-0 w-60 h-60 pointer-events-none z-0 opacity-40" viewBox="0 0 200 200" style="transform: scale(-1, -1);">
        <path d="M0,0 L100,0 C80,30 110,55 85,75 C60,95 50,125 25,105 C5,95 0,115 0,115 Z" fill="#5c0101" />
        <g fill="#7a0202"><circle cx="120" cy="30" r="5" /><circle cx="105" cy="95" r="5.5" /></g>
    </svg>

    <div class="max-w-2xl mx-auto p-6 relative z-20 mt-12 mb-12">
        <div class="bg-gray-950/95 border border-red-950 p-8 rounded-lg shadow-2xl relative">
            <a href="index.html" class="text-xs text-red-500 hover:text-red-300 mb-4 inline-block">&lt; ホームへ戻る</a>
            <h1 class="text-3xl sm:text-4xl font-bold text-center mb-6 text-blood-dark tracking-widest">整理券発行・チーム登録</h1>
            
            <!-- 整理券取得UI -->
            <div id="ticket-section">
                <h2 class="text-xl font-semibold mb-4 text-blood-dark border-b border-red-950 pb-2">ご希望の時間帯を選択</h2>
                <div id="slots-container" class="space-y-3">
                    <p class="text-gray-500">読込中...</p>
                </div>
                
                <div id="walkin-container" class="mt-6 hidden border-t border-red-950 pt-4">
                    <h2 class="text-xl font-semibold mb-2 text-red-600">急に来た方用 (当日枠)</h2>
                    <button onclick="issueTicket('walkin')" class="w-full bg-red-900 border border-red-700 text-white py-3 rounded hover:bg-red-800 font-bold shadow-btn">当日枠の整理券を発行する</button>
                </div>
            </div>

            <!-- QRコード＆完了画面UI -->
            <div id="qr-section" class="hidden text-center">
                <h2 class="text-2xl font-bold text-green-500 mb-4" style="text-shadow: 0 0 10px rgba(0,255,0,0.5);">整理券を発行しました！</h2>
                <p class="mb-4 text-gray-300">以下のQRコードを読み取り、チーム登録を完了させてください。</p>
                <div id="qrcode" class="flex justify-center mb-4 p-4 bg-white rounded-lg inline-block shadow-lg"></div>
                <p class="text-sm text-gray-500 break-all mb-4" id="qr-url"></p>
                <a href="index.html" class="inline-block mt-4 text-red-500 hover:underline">ホームに戻る</a>
            </div>

            <!-- チーム登録UI -->
            <div id="register-section" class="hidden">
                <h2 class="text-2xl font-bold mb-4 text-blood-dark">チーム登録</h2>
                <form id="team-form" onsubmit="submitTeam(event)">
                    <div class="mb-4">
                        <label class="block font-bold mb-1 text-gray-300">チーム名</label>
                        <input type="text" id="team-name" required class="w-full border border-red-950 bg-gray-900 text-gray-200 p-2 rounded focus:outline-none focus:border-red-700">
                    </div>
                    <div id="members-container" class="space-y-3 mb-4">
                    </div>
                    <button type="button" onclick="addMemberField()" class="text-red-400 hover:text-red-300 text-sm mb-6 block">+ メンバーを追加</button>
                    <button type="submit" class="w-full bg-[#260101] border border-[#520202] text-blood-dark py-3 rounded font-bold hover:bg-black transition shadow-btn text-lg tracking-widest">登録する</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action');
        const ticketId = urlParams.get('ticketId');

        if (action === 'register') {
            document.getElementById('ticket-section').style.display = 'none';
            document.getElementById('register-section').style.display = 'block';
            addMemberField();
        } else {
            loadSlots();
        }

        async function loadSlots() {
            const container = document.getElementById('slots-container');
            container.innerHTML = '';
            
            const settingsDoc = await db.collection('settings').doc('config').get();
            if(settingsDoc.exists && settingsDoc.data().walkInActive) {
                document.getElementById('walkin-container').style.display = 'block';
            }

            db.collection('slots').orderBy('time').onSnapshot(snapshot => {
                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const btn = document.createElement('button');
                    const isFull = data.booked >= data.capacity;
                    btn.className = `w-full p-4 rounded text-left font-bold border transition ${isFull ? 'bg-gray-900 text-gray-600 border-gray-800 cursor-not-allowed' : 'bg-red-950/40 hover:bg-red-900/60 text-red-200 border-red-900/50 shadow-sm'}`;
                    btn.innerHTML = `${data.time} (空き: ${data.capacity - data.booked}人)`;
                    btn.disabled = isFull;
                    btn.onclick = () => issueTicket(doc.id, data.time);
                    container.appendChild(btn);
                });
                if(snapshot.empty) {
                    container.innerHTML = '<p class="text-gray-500">現在公開されている時間枠はありません。</p>';
                }
            });
        }

        async function issueTicket(slotId, timeLabel) {
            const lastBooked = localStorage.getItem('lastBookedTime');
            if(lastBooked && (Date.now() - lastBooked < 60 * 60 * 1000)) {
                alert("一定時間内に複数回の整理券取得はできません。");
                return;
            }

            if (slotId !== 'walkin') {
                const slotRef = db.collection('slots').doc(slotId);
                try {
                    await db.runTransaction(async (transaction) => {
                        const doc = await transaction.get(slotRef);
                        const newBooked = doc.data().booked + 1;
                        if (newBooked > doc.data().capacity) throw "満員です";
                        transaction.update(slotRef, { booked: newBooked });
                    });
                } catch (e) {
                    alert(e); return;
                }
            }

            localStorage.setItem('lastBookedTime', Date.now());
            const newTicketId = 'TK' + Date.now();
            
            document.getElementById('ticket-section').style.display = 'none';
            document.getElementById('qr-section').style.display = 'block';
            
            const registerUrl = `${window.location.origin}${window.location.pathname}?action=register&ticketId=${newTicketId}`;
            new QRCode(document.getElementById("qrcode"), { text: registerUrl, width: 180, height: 180 });
            document.getElementById('qr-url').innerText = registerUrl;
        }

        let memberCount = 0;
        function addMemberField() {
            memberCount++;
            const div = document.createElement('div');
            div.className = "p-3 border border-red-950 bg-gray-900/50 rounded";
            div.innerHTML = `
                <p class="font-bold text-sm mb-2 text-red-400">メンバー ${memberCount}</p>
                <input type="text" placeholder="名前" class="w-full border border-red-950 bg-gray-900 text-gray-200 p-2 rounded mb-2 member-name focus:outline-none focus:border-red-700" required>
                <input type="text" placeholder="学年" class="w-full border border-red-950 bg-gray-900 text-gray-200 p-2 rounded mb-2 member-grade focus:outline-none focus:border-red-700" required>
                <input type="email" placeholder="メールアドレス" class="w-full border border-red-950 bg-gray-900 text-gray-200 p-2 rounded member-email focus:outline-none focus:border-red-700" required>
            `;
            document.getElementById('members-container').appendChild(div);
        }

        async function submitTeam(e) {
            e.preventDefault();
            const teamName = document.getElementById('team-name').value;
            const members = [];
            const names = document.querySelectorAll('.member-name');
            const grades = document.querySelectorAll('.member-grade');
            const emails = document.querySelectorAll('.member-email');
            
            for(let i = 0; i < names.length; i++) {
                members.push({ name: names[i].value, grade: grades[i].value, email: emails[i].value });
            }

            await db.collection('teams').add({ ticketId, teamName, members, createdAt: new Date() });
            alert("チーム登録が完了しました！時間になりましたらお越しください。");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
