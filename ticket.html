<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    
    <title>整理券発行＆チーム登録 - 恐怖の廃校</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="firebase-config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;900&family=Yuji+Boku&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'OnryouFont';
            src: url('home/onryu.ttf') format('truetype'), url('./home/onryu.ttf') format('truetype'), url('home/onryou.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        *, *::before, *::after, body, h1, h2, h3, p, span, a, button, input, div, header, rt, ruby, select { 
            font-family: 'OnryouFont', 'Yuji Boku', 'Shippori Mincho', serif !important; 
        }

        body { 
            background-color: #030303; 
            color: #d1d1d1; 
            overflow-x: hidden; 
            min-height: 100dvh; 
        }

        .text-blood-dark {
            background: linear-gradient(180deg, #ff1a1a 0%, #b30000 40%, #4d0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 2px #000000) drop-shadow(0 0 10px rgba(0,0,0,0.9));
        }
        
        .shadow-btn { box-shadow: 0 4px 15px rgba(80, 0, 0, 0.7); }
    </style>
</head>
<body class="relative">

    <div class="max-w-2xl mx-auto p-6 relative z-20 mt-12 mb-12">
        <div class="bg-gray-950/90 border border-red-950 p-8 rounded-lg shadow-2xl relative backdrop-blur-sm">
            <a href="index.html" class="text-xs text-red-500 hover:text-red-300 mb-4 inline-block">&lt; ホームへ戻る</a>
            <h1 class="text-3xl sm:text-4xl font-bold text-center mb-6 text-blood-dark tracking-widest">整理券発行・チーム登録</h1>
            
            <div id="ticket-section">
                <h2 class="text-xl font-semibold mb-4 text-blood-dark border-b border-red-950 pb-2">ご希望の時間帯を選択</h2>
                <div id="slots-container" class="space-y-3"><p class="text-gray-500">読込中...</p></div>
                <div id="walkin-container" class="mt-6 hidden border-t border-red-950 pt-4">
                    <h2 class="text-xl font-semibold mb-2 text-red-600">急に来た方用 (当日枠)</h2>
                    <button onclick="issueTicket('walkin')" class="w-full bg-red-900 border border-red-700 text-white py-3 rounded hover:bg-red-800 font-bold shadow-btn tracking-widest">当日枠の整理券を発行する</button>
                </div>
            </div>

            <!-- ① メンバー登録への誘導QR -->
            <div id="qr-section" class="hidden text-center">
                <h2 class="text-2xl font-bold text-red-500 mb-4" style="text-shadow: 0 0 10px rgba(255,0,0,0.5);">整理券の枠を確保しました</h2>
                <p class="mb-4 text-gray-300">以下のQRコードを読み取り、各自スマホからチーム登録を完了させてください。</p>
                <div id="qrcode" class="flex justify-center mb-4 p-4 bg-white rounded-lg inline-block shadow-lg"></div>
                <p class="text-sm text-gray-500 break-all mb-4" id="qr-url"></p>
            </div>

            <!-- ② チーム登録フォーム -->
            <div id="register-section" class="hidden">
                <h2 class="text-2xl font-bold mb-4 text-blood-dark">チーム登録</h2>
                <form id="team-form" onsubmit="submitTeam(event)">
                    <div class="mb-4">
                        <label class="block font-bold mb-1 text-gray-300">チーム名</label>
                        <input type="text" id="team-name" required class="w-full border border-red-950 bg-gray-900 text-gray-200 p-2 rounded focus:outline-none focus:border-red-700">
                    </div>
                    <div id="members-container" class="space-y-3 mb-4"></div>
                    <button type="button" onclick="addMemberField()" class="text-red-400 hover:text-red-300 text-sm mb-6 block">+ メンバーを追加</button>
                    <button type="submit" class="w-full bg-[#260101] border border-[#520202] text-blood-dark py-3 rounded font-bold hover:bg-black transition shadow-btn text-lg tracking-widest">登録完了する</button>
                </form>
            </div>

            <!-- ③ 受付に提示する最終QRコード -->
            <div id="final-qr-section" class="hidden text-center">
                <h2 class="text-3xl font-bold text-red-600 mb-4" style="text-shadow: 0 0 15px rgba(255,0,0,0.7);">登録完了！</h2>
                <p class="mb-4 text-gray-300">受付時にスタッフに以下の<span class="text-red-500 font-bold">「受付用QRコード」</span>を提示してください。</p>
                <div id="final-qrcode" class="flex justify-center mb-4 p-4 bg-white rounded-lg inline-block shadow-lg"></div>
                <p class="text-sm text-gray-400 mb-6">※スクリーンショットを撮って保存してください。</p>
                <a href="index.html" class="inline-block px-8 py-3 bg-red-900 hover:bg-red-800 text-white font-bold rounded transition">ホームに戻る</a>
            </div>

        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action');
        const ticketId = urlParams.get('ticketId');

        if (action === 'register') {
            document.getElementById('ticket-section').style.display = 'none';
            document.getElementById('register-section').style.display = 'block';
            addMemberField();
        } else {
            loadSlots();
        }

        async function loadSlots() {
            const container = document.getElementById('slots-container');
            container.innerHTML = '';
            const settingsDoc = await db.collection('settings').doc('config').get();
            if(settingsDoc.exists && settingsDoc.data().walkInActive) document.getElementById('walkin-container').style.display = 'block';

            db.collection('slots').orderBy('time').onSnapshot(snapshot => {
                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const btn = document.createElement('button');
                    const isFull = data.booked >= data.capacity;
                    btn.className = `w-full p-4 rounded text-left font-bold border transition tracking-widest ${isFull ? 'bg-gray-900 text-gray-600 border-gray-800 cursor-not-allowed' : 'bg-red-950/40 hover:bg-red-900/60 text-red-200 border-red-900/50 shadow-sm'}`;
                    btn.innerHTML = `${data.time} (空き: ${data.capacity - data.booked}人)`;
                    btn.disabled = isFull;
                    btn.onclick = () => issueTicket(doc.id, data.time);
                    container.appendChild(btn);
                });
                if(snapshot.empty) container.innerHTML = '<p class="text-gray-500">現在公開されている時間枠はありません。</p>';
            });
        }

        async function issueTicket(slotId, timeLabel) {
            const lastBooked = localStorage.getItem('lastBookedTime');
            if(lastBooked && (Date.now() - lastBooked < 60 * 60 * 1000)) return alert("一定時間内に複数回の整理券取得はできません。");

            if (slotId !== 'walkin') {
                const slotRef = db.collection('slots').doc(slotId);
                try {
                    await db.runTransaction(async (transaction) => {
                        const doc = await transaction.get(slotRef);
                        const newBooked = doc.data().booked + 1;
                        if (newBooked > doc.data().capacity) throw "満員です";
                        transaction.update(slotRef, { booked: newBooked });
                    });
                } catch (e) { alert(e); return; }
            }

            localStorage.setItem('lastBookedTime', Date.now());
            const newTicketId = 'TK' + Date.now();
            document.getElementById('ticket-section').style.display = 'none';
            document.getElementById('qr-section').style.display = 'block';
            
            const registerUrl = `${window.location.origin}${window.location.pathname}?action=register&ticketId=${newTicketId}`;
            new QRCode(document.getElementById("qrcode"), { text: registerUrl, width: 180, height: 180 });
            document.getElementById('qr-url').innerText = registerUrl;
        }

        let memberCount = 0;
        function addMemberField() {
            memberCount++;
            const div = document.createElement('div');
            div.className = "p-3 border border-red-950 bg-gray-900/50 rounded";
            div.innerHTML = `
                <p class="font-bold text-sm mb-2 text-red-400">メンバー ${memberCount}</p>
                <input type="text" placeholder="名前" class="w-full border border-red-950 bg-gray-900 text-gray-200 p-2 rounded mb-2 member-name focus:outline-none focus:border-red-700" required>
                <input type="text" placeholder="学年" class="w-full border border-red-950 bg-gray-900 text-gray-200 p-2 rounded mb-2 member-grade focus:outline-none focus:border-red-700" required>
                <input type="email" placeholder="メールアドレス" class="w-full border border-red-950 bg-gray-900 text-gray-200 p-2 rounded member-email focus:outline-none focus:border-red-700" required>
            `;
            document.getElementById('members-container').appendChild(div);
        }

        async function submitTeam(e) {
            e.preventDefault();
            const teamName = document.getElementById('team-name').value;
            const members = [];
            const names = document.querySelectorAll('.member-name');
            const grades = document.querySelectorAll('.member-grade');
            const emails = document.querySelectorAll('.member-email');
            for(let i = 0; i < names.length; i++) members.push({ name: names[i].value, grade: grades[i].value, email: emails[i].value });
            
            // 【変更】タイマー用の初期ステータスを持たせて保存
            const docRef = await db.collection('teams').add({ 
                ticketId, 
                teamName, 
                members, 
                createdAt: new Date(),
                status: 'registered', // まだゲーム開始前
                timerState: 'ready',  // タイマー状態
                accumulatedTime: 0    // 経過時間
            });
            
            // チーム固有のQRコードを表示する画面に切り替え
            document.getElementById('register-section').style.display = 'none';
            document.getElementById('final-qr-section').style.display = 'block';
            
            // スタッフ用QRコードを生成（ドキュメントIDを埋め込む）
            new QRCode(document.getElementById("final-qrcode"), { text: docRef.id, width: 220, height: 220 });
        }
    </script>
</body>
</html>
