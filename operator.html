<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>運営統合システム - 恐怖の廃校</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body { background-color: #111; color: #eee; font-family: sans-serif; }
        .font-mono { font-family: 'Share Tech Mono', monospace !important; }
        .tab-active { border-bottom: 4px solid #ef4444; color: #ef4444; font-weight: bold; }
        .tab-inactive { border-bottom: 1px solid #333; color: #888; }
        @keyframes alarmFlash { 0%, 100% { background-color: rgba(255, 0, 0, 0.4); } 50% { background-color: rgba(255, 0, 0, 0.8); } }
        .modal-alarm-active { animation: alarmFlash 0.5s infinite; }
    </style>
</head>
<body>
    <div class="max-w-4xl mx-auto p-4">
        <h1 class="text-2xl font-bold text-center text-red-500 mb-6">【運営】管理システム</h1>
        
        <nav class="flex mb-6 bg-gray-900 rounded-t-lg overflow-hidden">
            <button id="btn-timer" onclick="switchTab('timer')" class="flex-1 py-4 text-center tab-active transition">⏱ 整理券受付＆タイマー</button>
            <button id="btn-admin" onclick="switchTab('admin')" class="flex-1 py-4 text-center tab-inactive transition">⚙️ 設定・データ管理</button>
        </nav>

        <!-- =======================================================
             ⏱ タブ1：メイン画面（呼出番号 ＆ チーム作成 ＆ タイマー）
             ======================================================= -->
        <div id="tab-timer">
            
            <!-- 呼出番号コントロール -->
            <div class="bg-gray-800 border-2 border-red-700/80 p-5 rounded-xl mb-6 shadow-xl text-center">
                <p class="text-xs text-yellow-400 font-bold tracking-widest mb-1">【 ホーム画面の現在お呼出番号 】</p>
                <div class="flex items-center justify-center gap-4 my-2">
                    <button onclick="changeCurrentNumber(-1)" class="w-12 h-12 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-xl text-2xl shadow">-1</button>
                    <span id="admin-current-number" class="text-6xl font-mono font-black text-red-400 drop-shadow-md w-28 text-center">1</span>
                    <button onclick="changeCurrentNumber(1)" class="w-12 h-12 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl text-2xl shadow">+1</button>
                </div>
                <div class="flex gap-2 justify-center max-w-xs mx-auto mt-3">
                    <input type="number" id="direct-num-input" placeholder="直接指定" class="bg-gray-900 border border-gray-600 p-2 rounded text-white text-center w-28 font-mono">
                    <button onclick="setDirectNumber()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded font-bold text-sm text-white">番号変更</button>
                </div>
            </div>

            <!-- チーム受付＆タイマー作成 -->
            <div class="bg-gray-800 border border-gray-700 p-5 rounded-xl mb-6 shadow-xl">
                <h3 class="font-bold text-white mb-3 text-lg flex items-center gap-2">📝 チーム受付・タイマー作成</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3 mb-4">
                    <input type="number" id="ticket-number" placeholder="整理番号 (例: 12)" class="bg-gray-900 border border-gray-600 text-white p-3 rounded focus:outline-none focus:border-red-500 font-mono">
                    <input type="text" id="team-name" placeholder="チーム名 (例: 桃山連合)" class="bg-gray-900 border border-gray-600 text-white p-3 rounded focus:outline-none focus:border-red-500">
                    <input type="number" id="member-count" placeholder="人数 (1〜4名)" min="1" max="4" value="4" class="bg-gray-900 border border-gray-600 text-white p-3 rounded focus:outline-none focus:border-red-500">
                    <select id="puzzle-select" class="bg-gray-900 border border-gray-600 text-white p-3 rounded focus:outline-none focus:border-red-500"><option value="">(問題なし・共通)</option></select>
                    <select id="play-count" class="bg-gray-900 border border-gray-600 text-white p-3 rounded focus:outline-none focus:border-red-500"><option value="1">1回目 (初回)</option><option value="2">2回目以上 (猛者)</option></select>
                </div>
                <button onclick="createTeamTimer()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg tracking-wider">
                    ＋ タイマーを作成してリストに追加
                </button>
            </div>

            <h2 class="text-xl font-bold mb-4 text-red-400 border-b border-red-900 pb-2">現在プレイ中のチーム一覧</h2>
            <div id="timer-list" class="space-y-4"><p class="text-gray-500">プレイ中のチームはありません。</p></div>
        </div>

        <!-- =======================================================
             ⚙️ タブ2：設定・データ管理
             ======================================================= -->
        <div id="tab-admin" class="hidden space-y-8">
            <div class="bg-gray-800 p-6 rounded shadow border border-gray-700">
                <h2 class="text-xl font-bold mb-4 text-red-500 border-b border-gray-700 pb-2">ホーム画面 あらすじ設定</h2>
                <textarea id="story-text-input" rows="4" class="w-full bg-gray-900 text-white border border-gray-600 p-3 mb-4 rounded focus:outline-none focus:border-red-500"></textarea>
                <button onclick="saveStory()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded font-bold shadow">あらすじを保存する</button>
            </div>
            
            <!-- 謎・ヒント設定 -->
            <div class="bg-gray-800 p-6 rounded shadow border border-gray-700">
                <h2 class="text-xl font-bold mb-4 text-yellow-500 border-b border-gray-700 pb-2">謎（問題）とイベントの設定</h2>
                <div class="mb-6 bg-gray-900 p-4 rounded border border-gray-600">
                    <label class="block text-gray-300 font-bold mb-2">問題のナンバリング (例: 問題A)</label>
                    <input type="text" id="puzzle-name" class="w-full bg-gray-800 text-white border border-gray-600 p-3 mb-6 rounded focus:outline-none focus:border-yellow-500" placeholder="問題名を入力">
                    <label class="block text-gray-300 font-bold mb-2">この問題のイベント（ヒント / アラーム）</label>
                    <div id="hint-fields-container" class="space-y-3"></div>
                    <button onclick="addHintField()" class="text-yellow-400 hover:text-yellow-300 text-sm mt-4 font-bold block">+ イベントを追加</button>
                    
                    <div class="flex gap-3 mt-8">
                        <button id="btn-save-puzzle" onclick="savePuzzle()" class="flex-1 bg-yellow-600 hover:bg-yellow-500 text-white px-6 py-4 rounded font-bold text-lg shadow transition">この問題とイベントを登録する</button>
                        <button id="btn-cancel-edit" onclick="cancelEditPuzzle()" class="hidden bg-gray-600 hover:bg-gray-500 text-white px-6 py-4 rounded font-bold text-lg shadow transition">編集を破棄</button>
                    </div>
                </div>
                <h3 class="font-bold text-gray-400 mb-2 border-b border-gray-700 pb-2">登録済みの問題一覧（編集・削除可能）</h3>
                <ul id="puzzles-admin-list" class="space-y-3 mt-4"></ul>
            </div>

            <div class="bg-gray-800 p-6 rounded shadow border border-gray-700">
                <h2 class="text-xl font-bold mb-4 text-red-500 border-b border-gray-700 pb-2">機能スイッチ</h2>
                <div class="flex items-center justify-between py-2">
                    <span class="font-bold text-gray-200">2回目以降ランキングの公開</span>
                    <label class="flex items-center cursor-pointer">
                        <div class="relative"><input type="checkbox" id="toggle-repeater" class="sr-only" onchange="toggleRepeater()"><div id="toggle-bg" class="block w-14 h-8 rounded-full transition-colors bg-gray-600"></div><div id="toggle-dot" class="absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition-transform transform"></div></div>
                    </label>
                </div>
            </div>

            <!-- 💡【新機能】登録済みランキング記録の個別削除一覧 -->
            <div class="bg-gray-800 p-6 rounded shadow border border-gray-700">
                <h2 class="text-xl font-bold mb-2 text-red-500 border-b border-gray-700 pb-2">🏆 ランキング記録の個別管理（削除）</h2>
                <p class="text-xs text-gray-400 mb-4">間違えて追加してしまった記録を個別に削除できます。</p>
                <ul id="admin-times-list" class="space-y-2 max-h-80 overflow-y-auto pr-1">
                    <p class="text-gray-500 text-sm">記録を読み込み中...</p>
                </ul>
            </div>

            <!-- テストデータ一括消去 -->
            <div class="bg-gray-800 p-6 rounded shadow border border-red-900/80">
                <h2 class="text-xl font-bold mb-2 text-red-500 border-b border-gray-700 pb-2">テストデータ一括消去</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                    <button onclick="clearRankings()" class="p-4 bg-gray-900 hover:bg-red-950 border border-red-900 text-red-300 font-bold rounded shadow transition text-sm">🏆 ランキング記録を全消去</button>
                    <button onclick="clearTeams()" class="p-4 bg-gray-900 hover:bg-red-950 border border-red-900 text-red-300 font-bold rounded shadow transition text-sm">👥 チーム情報を全消去</button>
                </div>
                <div class="border-t border-gray-700 pt-4 mt-4">
                    <button onclick="clearAllTestData()" class="w-full py-4 bg-red-900 hover:bg-red-800 border-2 border-red-600 text-white font-bold rounded-lg shadow-lg transition text-base tracking-wider">⚠️【本番前用】すべてのテストデータを一括全消去</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 🖥️ 拡大タイマー・モーダル -->
    <div id="enlarged-timer-modal" class="fixed inset-0 bg-[#030303] text-[#d1d1d1] z-50 hidden flex flex-col justify-between p-6 overflow-y-auto">
        <div class="flex justify-between items-center border-b border-red-950 pb-4 max-w-2xl mx-auto w-full">
            <div>
                <span class="text-xs text-yellow-400 font-bold tracking-wider" id="modal-puzzle-name">問題: 共通</span>
                <h2 id="modal-team-name" class="text-2xl sm:text-3xl font-bold text-white tracking-widest"></h2>
            </div>
            <button onclick="closeEnlargedTimer()" class="text-2xl text-gray-400 hover:text-white px-4 py-2 bg-gray-900 border border-gray-700 rounded-xl font-bold transition">✕ 閉じる</button>
        </div>

        <div class="my-auto text-center py-6 w-full max-w-xl mx-auto">
            <div class="bg-black/90 border-2 border-red-900 p-6 rounded-2xl shadow-[0_0_35px_rgba(255,0,0,0.25)] mb-6">
                <p class="text-xs text-gray-500 mb-2 tracking-widest font-mono">ESCAPE TIME</p>
                <div id="modal-timer-display" class="text-6xl sm:text-7xl font-mono text-red-500 font-bold drop-shadow-[0_0_10px_#ff0000]">00:00.00</div>
            </div>
            <div id="modal-hints-container" class="space-y-4 mb-6 text-left"></div>
            <button id="modal-stop-alarm-btn" onclick="stopModalSiren()" class="hidden w-full bg-red-600 text-white py-6 rounded-2xl font-bold text-3xl shadow-[0_0_25px_#ff0000] animate-pulse tracking-widest border-4 border-red-400">🚨 サイレンを止める！</button>
        </div>

        <!-- 💡 拡大画面の操作フッター（クリア決定 / 不正解(記録なし) / 破棄） -->
        <div class="flex flex-col sm:flex-row gap-2 max-w-xl mx-auto w-full border-t border-red-950 pt-4">
            <button id="modal-toggle-btn" onclick="toggleCurrentModalTimer()" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl shadow text-lg transition">▶ 再生</button>
            <button onclick="finishCurrentModalTimer()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow text-lg transition">🏆 クリア決定</button>
            <button onclick="finishCurrentModalFailedTimer()" class="bg-red-900 hover:bg-red-800 text-white font-bold py-4 px-4 rounded-xl shadow text-sm transition">💀 不正解 (記録なし)</button>
            <button onclick="finishCurrentModalNoRecordTimer()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold py-4 px-3 rounded-xl shadow text-xs transition">破棄</button>
        </div>
        <div id="modal-alarm-overlay" class="fixed inset-0 pointer-events-none z-10 hidden modal-alarm-active"></div>
    </div>

    <script>
        function generateReadableId() {
            const chars = '2345689ABCDEFGHJKLMNPQRSTUVWXYZ';
            let res = ''; for (let i = 0; i < 4; i++) res += chars.charAt(Math.floor(Math.random() * chars.length)); return res;
        }

        function switchTab(t) {
            ['timer','admin'].forEach(id => {
                document.getElementById(`tab-${id}`).style.display = (id === t) ? 'block' : 'none';
                document.getElementById(`btn-${id}`).className = (id === t) ? "flex-1 py-4 text-center tab-active transition" : "flex-1 py-4 text-center tab-inactive hover:bg-gray-800 transition";
            });
        }

        // ================= 整理番号コントロール =================
        let currentCallingNumber = 1;

        db.collection('settings').doc('config').onSnapshot(doc => {
            if (doc.exists) {
                const d = doc.data();
                currentCallingNumber = d.currentNumber || 1;
                document.getElementById('admin-current-number').innerText = currentCallingNumber;
                document.getElementById('story-text-input').value = d.storyText || "";
                updateToggleUI(d.showRepeaters || false);
            } else {
                db.collection('settings').doc('config').set({ currentNumber: 1, showRepeaters: false });
            }
        });

        async function changeCurrentNumber(diff) {
            const newNum = Math.max(1, currentCallingNumber + diff);
            try { await db.collection('settings').doc('config').set({ currentNumber: newNum }, { merge: true }); } catch(e) { alert("更新エラー: " + e.message); }
        }

        async function setDirectNumber() {
            const val = parseInt(document.getElementById('direct-num-input').value);
            if (!val || val < 1) return alert("1以上の番号を入力してください");
            try {
                await db.collection('settings').doc('config').set({ currentNumber: val }, { merge: true });
                document.getElementById('direct-num-input').value = '';
            } catch(e) { alert("更新エラー: " + e.message); }
        }

        // ================= チーム受付＆タイマー作成 =================
        async function createTeamTimer() {
            const num = document.getElementById('ticket-number').value.trim();
            const name = document.getElementById('team-name').value.trim();
            const count = parseInt(document.getElementById('member-count').value) || 4;
            const pId = document.getElementById('puzzle-select').value;
            const playCount = parseInt(document.getElementById('play-count').value);

            if (!num) return alert("整理番号を入力してください");
            if (!name) return alert("チーム名を入力してください");

            const customId = "T-" + num + "-" + generateReadableId();
            try {
                await db.collection('teams').doc(customId).set({
                    ticketNumber: num,
                    teamName: `${name} (${num}番)`,
                    rawTeamName: name,
                    memberCount: count,
                    puzzleId: pId,
                    playCount: playCount,
                    status: 'playing',
                    timerState: 'ready',
                    accumulatedTime: 0,
                    createdAt: new Date()
                });

                document.getElementById('ticket-number').value = '';
                document.getElementById('team-name').value = '';
                alert(`整理番号${num}番「${name}」のタイマーを作成しました！`);
            } catch(e) { alert("作成エラー: " + e.message); }
        }

        // ================= タイマー管理リスト =================
        db.collection('teams').where('status', '==', 'playing').onSnapshot(snap => {
            const list = document.getElementById('timer-list'); list.innerHTML = '';
            if(snap.empty) { list.innerHTML = '<p class="text-gray-500">プレイ中のチームはありません。</p>'; return; }
            
            let teams = [];
            snap.forEach(doc => teams.push({ id: doc.id, ...doc.data() }));
            teams.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));

            teams.forEach(d => {
                const id = d.id;
                let btn = "▶ 再生"; let col = "bg-green-600"; let p = "";
                if(d.timerState === 'running') { btn = "⏸ 一時停止"; col = "bg-yellow-600"; p = "text-red-400"; }
                
                const c = document.createElement('div');
                c.className = "bg-gray-800 border border-gray-700 p-5 rounded-lg shadow-lg flex flex-col md:flex-row justify-between items-center gap-4";
                c.innerHTML = `
                    <div class="flex-1 w-full text-center md:text-left">
                        <div class="flex items-center gap-2 justify-center md:justify-start mb-1">
                            <span class="bg-red-900 text-red-200 px-2 py-0.5 rounded text-xs font-bold font-mono">No.${d.ticketNumber || '-'}</span>
                            <h3 class="text-2xl font-bold text-white">${d.rawTeamName || d.teamName}</h3>
                        </div>
                        <p class="text-xs text-gray-400">人数: ${d.memberCount || 4}名 / 参加: ${d.playCount}回目</p>
                    </div>
                    <div class="text-5xl font-mono ${p} tracking-widest timer-display font-bold" data-id="${id}" data-state="${d.timerState}" data-start="${d.startTime || 0}" data-acc="${d.accumulatedTime || 0}">00:00.00</div>
                    <div class="flex flex-wrap gap-2 w-full md:w-auto">
                        <button onclick="openEnlargedTimer('${id}')" class="bg-purple-900 hover:bg-purple-800 text-purple-200 border border-purple-600 font-bold py-2.5 px-3 rounded shadow text-sm">🖥 拡大表示</button>
                        <button onclick="toggleTimer('${id}')" class="flex-1 md:w-24 ${col} text-white font-bold py-2.5 px-2 rounded shadow">${btn}</button>
                        <button onclick="finishTimer('${id}')" class="flex-1 md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-3 rounded shadow text-sm">🏆 決定</button>
                        <!-- 💡【新機能】不正解ボタン -->
                        <button onclick="finishFailedTimer('${id}')" class="bg-red-900 hover:bg-red-800 text-white font-bold py-2.5 px-3 rounded shadow text-xs">💀 不正解</button>
                        <button onclick="finishNoRecordTimer('${id}')" class="bg-gray-700 hover:bg-gray-600 text-gray-300 font-bold py-2.5 px-2 rounded shadow text-xs">破棄</button>
                    </div>
                `;
                list.appendChild(c);
            });
        });

        setInterval(() => {
            document.querySelectorAll('.timer-display').forEach(el => {
                if(el.dataset.state === 'running') el.innerText = formatTime(parseInt(el.dataset.acc) + (Date.now() - parseInt(el.dataset.start)));
                else if(el.dataset.state === 'ready') el.innerText = "00:00.00";
                else el.innerText = formatTime(parseInt(el.dataset.acc));
            });

            if (activeModalTeamId && activeModalTeamData) {
                let elapsed = activeModalTeamData.accumulatedTime || 0;
                if (activeModalTeamData.timerState === 'running') elapsed += (Date.now() - (activeModalTeamData.startTime || Date.now()));
                const modalTimerEl = document.getElementById('modal-timer-display');
                if (modalTimerEl) modalTimerEl.innerText = formatTime(elapsed);

                if (modalPuzzleHints.length > 0) {
                    modalPuzzleHints.forEach((event, idx) => {
                        if (elapsed >= event.timeMs && !modalShownEvents.has(idx)) {
                            modalShownEvents.add(idx);
                            if (event.type === 'alarm') playModalHorrorSiren();
                            else {
                                const container = document.getElementById('modal-hints-container');
                                if (container) {
                                    const box = document.createElement('div');
                                    box.className = "bg-yellow-950/70 border border-yellow-600 text-yellow-300 p-4 rounded-xl shadow-lg text-left whitespace-pre-wrap animate-pulse";
                                    box.innerHTML = `<span class="font-bold text-white border-b border-yellow-600 block mb-2 pb-1">💡 ${event.timeMin}分経過 ヒント</span>${event.text}`;
                                    container.appendChild(box);
                                }
                            }
                        }
                    });
                }
            }
        }, 30);

        async function toggleTimer(id) {
            const r = db.collection('teams').doc(id); const d = await r.get(); const dt = d.data();
            if (dt.timerState === 'ready' || dt.timerState === 'paused') await r.update({ timerState: 'running', startTime: Date.now() });
            else if (dt.timerState === 'running') await r.update({ timerState: 'paused', accumulatedTime: dt.accumulatedTime + (Date.now() - dt.startTime) });
        }

        // 🏆 クリア決定（タイム付きランキング登録）
        async function finishTimer(id) {
            if(!confirm("タイムを決定してランキングに追加しますか？")) return;
            const r = db.collection('teams').doc(id); const d = await r.get(); const dt = d.data();
            let ft = dt.accumulatedTime; if (dt.timerState === 'running') ft += (Date.now() - dt.startTime);
            try { 
                await db.collection('times').add({ 
                    teamName: dt.rawTeamName || dt.teamName, 
                    time: ft, 
                    isFailed: false,
                    count: dt.playCount || 1, 
                    timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                }); 
                await r.update({ status: 'finished', isNoRecord: false }); 
                if (activeModalTeamId === id) closeEnlargedTimer();
                alert("ランキングに送信完了しました！"); 
            } catch (e) { alert("エラー: " + e.message); }
        }

        // 💀【新機能】不正解・失敗（「記録なし」としてランキングに登録）
        async function finishFailedTimer(id) {
            if(!confirm("【不正解 / 脱出失敗】としてランキングに「記録なし」で追加しますか？")) return;
            const r = db.collection('teams').doc(id); const d = await r.get(); const dt = d.data();
            try { 
                await db.collection('times').add({ 
                    teamName: dt.rawTeamName || dt.teamName, 
                    time: 99999999, // 最下部に並ぶようにダミー値
                    isFailed: true, // 💡 不正解フラグ
                    count: dt.playCount || 1, 
                    timestamp: firebase.firestore.FieldValue.serverTimestamp() 
                }); 
                await r.update({ status: 'finished', isNoRecord: false }); 
                if (activeModalTeamId === id) closeEnlargedTimer();
                alert("「記録なし (不正解)」としてランキングに追加しました！"); 
            } catch (e) { alert("エラー: " + e.message); }
        }

        // 破棄終了（ランキングに載せない）
        async function finishNoRecordTimer(id) {
            if(!confirm("ランキングに登録せず、このタイマーを破棄して終了しますか？")) return;
            try {
                await db.collection('teams').doc(id).update({ status: 'finished', isNoRecord: true });
                if (activeModalTeamId === id) closeEnlargedTimer();
                alert("破棄しました。");
            } catch (e) { alert("エラー: " + e.message); }
        }

        function formatTime(ms) { const m = Math.floor(ms / 60000).toString().padStart(2, '0'); const s = Math.floor((ms % 60000) / 1000).toString().padStart(2, '0'); const c = Math.floor((ms % 1000) / 10).toString().padStart(2, '0'); return `${m}:${s}.${c}`; }

        // ================= 🖥️ 拡大タイマー機能 =================
        let activeModalTeamId = null; let activeModalTeamData = null; let modalPuzzleHints = []; let modalShownEvents = new Set();
        let modalAudioCtx = null; let modalAlarmInterval = null; let modalAlarmPlayed = false; let modalTeamUnsubscribe = null;

        function initModalAudio() {
            if (!modalAudioCtx) { const AudioContext = window.AudioContext || window.webkitAudioContext; modalAudioCtx = new AudioContext(); }
            if (modalAudioCtx.state === 'suspended') modalAudioCtx.resume();
        }

        async function openEnlargedTimer(teamId) {
            activeModalTeamId = teamId; modalShownEvents.clear(); modalAlarmPlayed = false; initModalAudio();
            document.getElementById('enlarged-timer-modal').classList.remove('hidden'); document.getElementById('enlarged-timer-modal').classList.add('flex');
            document.getElementById('modal-hints-container').innerHTML = ''; document.getElementById('modal-stop-alarm-btn').style.display = 'none';

            modalTeamUnsubscribe = db.collection('teams').doc(teamId).onSnapshot(async doc => {
                if(!doc.exists) return; activeModalTeamData = doc.data();
                document.getElementById('modal-team-name').innerText = activeModalTeamData.rawTeamName || activeModalTeamData.teamName;
                const toggleBtn = document.getElementById('modal-toggle-btn');
                if (activeModalTeamData.timerState === 'running') {
                    toggleBtn.innerText = "⏸ 一時停止"; toggleBtn.className = "flex-1 bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-4 rounded-xl shadow text-xl transition";
                } else {
                    toggleBtn.innerText = "▶ 再生"; toggleBtn.className = "flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl shadow text-xl transition";
                }
                if (activeModalTeamData.puzzleId) {
                    const pDoc = await db.collection('puzzles').doc(activeModalTeamData.puzzleId).get();
                    if (pDoc.exists) {
                        document.getElementById('modal-puzzle-name').innerText = `挑戦中の謎: ${pDoc.data().name}`;
                        modalPuzzleHints = pDoc.data().hints || [];
                    }
                } else {
                    document.getElementById('modal-puzzle-name').innerText = `問題: 共通`;
                    modalPuzzleHints = [];
                }
            });
        }

        function closeEnlargedTimer() {
            if (modalTeamUnsubscribe) modalTeamUnsubscribe();
            stopModalSiren(); activeModalTeamId = null; activeModalTeamData = null;
            document.getElementById('enlarged-timer-modal').classList.add('hidden'); document.getElementById('enlarged-timer-modal').classList.remove('flex');
        }

        function toggleCurrentModalTimer() { if (activeModalTeamId) toggleTimer(activeModalTeamId); }
        function finishCurrentModalTimer() { if (activeModalTeamId) finishTimer(activeModalTeamId); }
        function finishCurrentModalFailedTimer() { if (activeModalTeamId) finishFailedTimer(activeModalTeamId); }
        function finishCurrentModalNoRecordTimer() { if (activeModalTeamId) finishNoRecordTimer(activeModalTeamId); }

        function playModalHorrorSiren() {
            if (modalAlarmPlayed) return; modalAlarmPlayed = true; initModalAudio();
            document.getElementById('modal-alarm-overlay').style.display = 'block'; document.getElementById('modal-stop-alarm-btn').style.display = 'block';
            modalAlarmInterval = setInterval(() => {
                const osc1 = modalAudioCtx.createOscillator(); const osc2 = modalAudioCtx.createOscillator(); const gain = modalAudioCtx.createGain();
                osc1.type = 'sawtooth'; osc2.type = 'square';
                osc1.frequency.setValueAtTime(800, modalAudioCtx.currentTime); osc1.frequency.exponentialRampToValueAtTime(600, modalAudioCtx.currentTime + 0.4);
                osc2.frequency.setValueAtTime(850, modalAudioCtx.currentTime); osc2.frequency.exponentialRampToValueAtTime(650, modalAudioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0, modalAudioCtx.currentTime); gain.gain.linearRampToValueAtTime(1, modalAudioCtx.currentTime + 0.1); gain.gain.linearRampToValueAtTime(0, modalAudioCtx.currentTime + 0.5);
                osc1.connect(gain); osc2.connect(gain); gain.connect(modalAudioCtx.destination);
                osc1.start(); osc2.start(); osc1.stop(modalAudioCtx.currentTime + 0.5); osc2.stop(modalAudioCtx.currentTime + 0.5);
            }, 600);
        }

        function stopModalSiren() {
            if (modalAlarmInterval) clearInterval(modalAlarmInterval); modalAlarmPlayed = false;
            document.getElementById('modal-alarm-overlay').style.display = 'none'; document.getElementById('modal-stop-alarm-btn').style.display = 'none';
        }

        // ================= 💡【新機能】ランキング記録一覧 ＆ 個別削除 =================
        db.collection('times').orderBy('timestamp', 'desc').onSnapshot(snap => {
            const list = document.getElementById('admin-times-list');
            list.innerHTML = '';
            if (snap.empty) {
                list.innerHTML = '<p class="text-gray-500 text-sm">現在ランキング記録はありません。</p>';
                return;
            }
            snap.forEach(doc => {
                const d = doc.data();
                const id = doc.id;
                const timeText = d.isFailed ? '<span class="text-red-400 font-bold">【記録なし (不正解)】</span>' : `<span class="text-green-400 font-mono font-bold">${formatTime(d.time)}</span>`;
                
                list.innerHTML += `
                    <li class="flex justify-between items-center bg-gray-900 border border-gray-700 p-3 rounded text-sm">
                        <div>
                            <span class="text-white font-bold">${d.teamName}</span>
                            <span class="text-gray-400 text-xs ml-2">(${d.count}回目)</span>
                            <div class="text-xs mt-0.5">${timeText}</div>
                        </div>
                        <button onclick="deleteRankingItem('${id}', '${d.teamName}')" class="bg-red-800 hover:bg-red-700 text-white font-bold px-3 py-1.5 rounded text-xs shadow transition">
                            🗑️ 削除
                        </button>
                    </li>
                `;
            });
        });

        async function deleteRankingItem(id, teamName) {
            if (!confirm(`「${teamName}」のランキング記録を削除しますか？\n（ランキング画面からも消去されます）`)) return;
            try {
                await db.collection('times').doc(id).delete();
                alert(`「${teamName}」の記録を削除しました。`);
            } catch(e) { alert("削除エラー: " + e.message); }
        }

        // ================= 設定・謎・ヒント管理 =================
        function updateToggleUI(act) {
            const bg = document.getElementById('toggle-bg'); const dot = document.getElementById('toggle-dot'); document.getElementById('toggle-repeater').checked = act;
            if (act) { bg.classList.remove('bg-gray-600'); bg.classList.add('bg-green-500'); dot.classList.add('translate-x-6'); } 
            else { bg.classList.add('bg-gray-600'); bg.classList.remove('bg-green-500'); dot.classList.remove('translate-x-6'); }
        }
        async function saveStory() { try { await db.collection('settings').doc('config').set({ storyText: document.getElementById('story-text-input').value }, {merge: true}); alert("保存しました！"); } catch (e) { alert("エラー: " + e.message); } }
        async function toggleRepeater() { try { await db.collection('settings').doc('config').set({ showRepeaters: document.getElementById('toggle-repeater').checked }, {merge: true}); } catch (e) { alert("エラー: " + e.message); } }
        
        let editingPuzzleId = null;
        function addHintField(timeVal = "", typeVal = "hint", textVal = "") {
            const c = document.getElementById('hint-fields-container'); const div = document.createElement('div');
            div.className = "flex flex-col md:flex-row items-center gap-2 hint-item bg-gray-800 border border-gray-700 p-3 rounded";
            div.innerHTML = `
                <div class="flex items-center gap-2"><input type="number" class="w-20 bg-gray-900 text-white border border-gray-600 p-2 rounded hint-time" min="0" step="0.1" value="${timeVal}"><span class="text-gray-400 font-bold">分後</span></div>
                <select class="bg-gray-900 text-white border border-gray-600 p-2 rounded event-type w-full md:w-auto"><option value="hint" ${typeVal==='hint'?'selected':''}>💡 ヒント</option><option value="alarm" ${typeVal==='alarm'?'selected':''}>🚨 サイレン</option></select>
                <input type="text" placeholder="ヒント内容 (サイレンは空でOK)" class="flex-1 w-full bg-gray-900 text-white border border-gray-600 p-2 rounded hint-text" value="${textVal}">
                <button onclick="this.parentElement.remove()" class="text-red-500 font-bold px-3 py-1 text-xl">×</button>
            `;
            c.appendChild(div);
        }
        window.addEventListener('DOMContentLoaded', () => { addHintField(); });

        function editPuzzle(id) {
            db.collection('puzzles').doc(id).get().then(doc => {
                if(!doc.exists) return; const d = doc.data(); editingPuzzleId = id;
                document.getElementById('puzzle-name').value = d.name;
                const c = document.getElementById('hint-fields-container'); c.innerHTML = '';
                if(d.hints && d.hints.length > 0) d.hints.forEach(h => addHintField(h.timeMin, h.type || 'hint', h.text || ''));
                else addHintField();
                const btn = document.getElementById('btn-save-puzzle');
                btn.innerText = "✏️ 編集内容を上書き保存する"; btn.className = "flex-1 bg-orange-600 hover:bg-orange-500 text-white px-6 py-4 rounded font-bold text-lg shadow transition";
                document.getElementById('btn-cancel-edit').style.display = 'block';
                document.getElementById('puzzle-name').scrollIntoView({ behavior: 'smooth' });
            });
        }
        function cancelEditPuzzle() {
            editingPuzzleId = null; document.getElementById('puzzle-name').value = '';
            document.getElementById('hint-fields-container').innerHTML = ''; addHintField();
            const btn = document.getElementById('btn-save-puzzle');
            btn.innerText = "この問題とイベントを登録する"; btn.className = "flex-1 bg-yellow-600 hover:bg-yellow-500 text-white px-6 py-4 rounded font-bold text-lg shadow transition";
            document.getElementById('btn-cancel-edit').style.display = 'none';
        }
        async function savePuzzle() {
            const name = document.getElementById('puzzle-name').value.trim(); if(!name) return alert("問題名を入力してください");
            const events = [];
            document.querySelectorAll('.hint-item').forEach(item => {
                const t = item.querySelector('.hint-time').value; const type = item.querySelector('.event-type').value; const text = item.querySelector('.hint-text').value;
                if(t && (type === 'alarm' || text)) events.push({ timeMin: Number(t), timeMs: Number(t) * 60000, type: type, text: text });
            });
            events.sort((a, b) => a.timeMs - b.timeMs);
            try {
                if(editingPuzzleId) { await db.collection('puzzles').doc(editingPuzzleId).update({ name, hints: events }); alert("上書き保存しました！"); cancelEditPuzzle(); }
                else { await db.collection('puzzles').add({ name, hints: events, createdAt: new Date() }); alert("登録しました！"); cancelEditPuzzle(); }
            } catch(e) { alert("エラー: " + e.message); }
        }
        db.collection('puzzles').onSnapshot(snap => {
            const list = document.getElementById('puzzles-admin-list'); const select = document.getElementById('puzzle-select');
            list.innerHTML = ''; if(select) select.innerHTML = '<option value="">(問題なし・共通)</option>';
            snap.forEach(doc => {
                const d = doc.data(); let hText = (d.hints || []).map(h => h.type === 'alarm' ? `${h.timeMin}分:🚨` : `${h.timeMin}分:💡`).join(' / '); if(!hText) hText = "設定なし";
                list.innerHTML += `<li class="flex flex-col md:flex-row justify-between items-start md:items-center bg-gray-800 border border-gray-700 p-4 rounded gap-3"><div><span class="text-yellow-400 font-bold block mb-1 text-lg">${d.name}</span><span class="text-gray-400 text-sm">${hText}</span></div><div class="flex gap-2 w-full md:w-auto"><button onclick="editPuzzle('${doc.id}')" class="bg-orange-600 hover:bg-orange-500 px-4 py-2 rounded font-bold text-white text-sm shadow">✏️ 編集</button><button onclick="if(confirm('削除しますか？')) db.collection('puzzles').doc('${doc.id}').delete()" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded font-bold text-white text-sm shadow">削除</button></div></li>`;
                if(select) select.innerHTML += `<option value="${doc.id}">${d.name}</option>`;
            });
        });

        // ================= 枠・チーム一括削除 =================
        async function clearRankings() { if (!confirm("【ランキング記録】を全消去しますか？")) return; const snap = await db.collection('times').get(); const b = db.batch(); snap.forEach(doc => b.delete(doc.ref)); await b.commit(); alert("全消去完了！"); }
        async function clearTeams() { if (!confirm("【登録チーム情報】を全消去しますか？")) return; const s1 = await db.collection('teams').get(); const b1 = db.batch(); s1.forEach(doc => b1.delete(doc.ref)); await b1.commit(); alert("全消去完了！"); }
        async function clearAllTestData() { if (!confirm("すべてのテストデータを一括全消去しますか？")) return; if (!confirm("本当によろしいですか？")) return; const s1 = await db.collection('times').get(); const b1 = db.batch(); s1.forEach(doc => b1.delete(doc.ref)); await b1.commit(); const s2 = await db.collection('teams').get(); const b2 = db.batch(); s2.forEach(doc => b2.delete(doc.ref)); await b2.commit(); alert("初期化が完了しました！"); }
    </script>
</body>
</html>
