<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者設定</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded shadow-lg">
        <h1 class="text-3xl font-bold text-red-600 mb-6 border-b pb-2">管理者コントロールパネル</h1>
        
        <div class="mb-8 p-4 bg-gray-50 rounded border">
            <h2 class="text-xl font-bold mb-4">ホーム画面 あらすじ設定</h2>
            <input type="text" id="story-title-input" placeholder="タイトル" class="w-full border p-2 mb-2 rounded">
            <textarea id="story-text-input" rows="4" placeholder="あらすじ本文" class="w-full border p-2 mb-2 rounded"></textarea>
            <button onclick="saveStory()" class="bg-green-600 text-white px-4 py-2 rounded font-bold hover:bg-green-700">あらすじを保存</button>

            <h2 class="text-xl font-bold mt-6 mb-4">機能スイッチ</h2>
            <div class="flex items-center justify-between mb-2">
                <span class="font-bold">急に来た人用（当日枠）の整理券発行</span>
                <button id="toggle-walkin" onclick="toggleSetting('walkInActive')" class="px-4 py-2 rounded text-white font-bold bg-gray-400">読込中...</button>
            </div>
            <div class="flex items-center justify-between">
                <span class="font-bold">2回目以降（リピーター）ランキングの公開</span>
                <button id="toggle-repeater" onclick="toggleSetting('showRepeaters')" class="px-4 py-2 rounded text-white font-bold bg-gray-400">読込中...</button>
            </div>
        </div>

        <div class="mb-8 p-4 bg-yellow-50 rounded border">
            <h2 class="text-xl font-bold mb-4 text-yellow-800">謎(問題)の登録</h2>
            <div class="grid grid-cols-2 gap-4 mb-2">
                <div><label class="text-sm font-bold">ナンバリング (例: A, 難問Ver)</label><input type="text" id="pz-name" class="w-full border p-2 rounded"></div>
                <div><label class="text-sm font-bold">ヒント表示までの時間 (秒)</label><input type="number" id="pz-time" value="180" class="w-full border p-2 rounded"></div>
            </div>
            <div class="mb-2"><label class="text-sm font-bold">謎の画像URL (Gyazo等の直リンク)</label><input type="text" id="pz-url" class="w-full border p-2 rounded"></div>
            <div class="mb-4"><label class="text-sm font-bold">ヒント内容 (テキスト)</label><textarea id="pz-hint" rows="2" class="w-full border p-2 rounded"></textarea></div>
            <button onclick="addPuzzle()" class="bg-yellow-600 text-white px-4 py-2 rounded font-bold hover:bg-yellow-700">この謎を追加する</button>
            
            <h3 class="font-bold mt-6 mb-2">登録済みの謎一覧</h3>
            <ul id="puzzle-list" class="space-y-2"></ul>
        </div>

        <div class="p-4 bg-blue-50 rounded border">
            <h2 class="text-xl font-bold mb-4 text-blue-800">整理券 時間枠の追加</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="slot-time" placeholder="例: 10:00〜10:30" class="border p-2 flex-1 rounded">
                <input type="number" id="slot-cap" placeholder="定員数" class="border p-2 w-24 rounded">
                <button onclick="addSlot()" class="bg-blue-600 text-white px-4 rounded font-bold hover:bg-blue-700">追加</button>
            </div>
            <h3 class="font-bold mb-2">現在の枠一覧</h3>
            <ul id="slots-admin-list" class="space-y-2"></ul>
        </div>
    </div>

    <script>
        db.collection('settings').doc('config').onSnapshot(doc => {
            if(doc.exists) {
                const data = doc.data();
                document.getElementById('story-title-input').value = data.storyTitle || "";
                document.getElementById('story-text-input').value = data.storyText || "";
                updateBtn('toggle-walkin', data.walkInActive, '発行中 (ON)', '停止中 (OFF)');
                updateBtn('toggle-repeater', data.showRepeaters, '公開中 (ON)', '非公開 (OFF)');
            } else {
                db.collection('settings').doc('config').set({ walkInActive: false, showRepeaters: false });
            }
        });

        function updateBtn(id, isActive, textOn, textOff) {
            const btn = document.getElementById(id);
            btn.innerText = isActive ? textOn : textOff;
            btn.className = `px-4 py-2 rounded text-white font-bold ${isActive ? 'bg-green-500' : 'bg-red-500'}`;
        }
        async function toggleSetting(field) {
            const doc = await db.collection('settings').doc('config').get();
            await db.collection('settings').doc('config').update({ [field]: !doc.data()[field] });
        }
        async function saveStory() {
            await db.collection('settings').doc('config').update({
                storyTitle: document.getElementById('story-title-input').value,
                storyText: document.getElementById('story-text-input').value
            });
            alert("あらすじを更新しました！");
        }

        async function addPuzzle() {
            const name = document.getElementById('pz-name').value;
            const url = document.getElementById('pz-url').value;
            if(!name || !url) return alert("ナンバリングとURLは必須です");
            await db.collection('puzzles').add({
                name: name, imageUrl: url,
                hintTimeSec: parseInt(document.getElementById('pz-time').value) || 999,
                hintText: document.getElementById('pz-hint').value
            });
            alert("追加しました");
        }
        db.collection('puzzles').onSnapshot(snap => {
            const list = document.getElementById('puzzle-list');
            list.innerHTML = '';
            snap.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `<li class="flex justify-between bg-white p-2 border rounded">
                    <span>${d.name} (ヒント: ${d.hintTimeSec}秒後)</span>
                    <button onclick="db.collection('puzzles').doc('${doc.id}').delete()" class="text-red-500 text-sm">削除</button>
                </li>`;
            });
        });

        async function addSlot() {
            await db.collection('slots').add({
                time: document.getElementById('slot-time').value,
                capacity: parseInt(document.getElementById('slot-cap').value), booked: 0
            });
        }
        db.collection('slots').orderBy('time').onSnapshot(snap => {
            const list = document.getElementById('slots-admin-list');
            list.innerHTML = '';
            snap.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `<li class="flex justify-between bg-white p-2 border rounded">
                    <span>${d.time} (定員: ${d.capacity} / 予約済: ${d.booked})</span>
                    <button onclick="db.collection('slots').doc('${doc.id}').delete()" class="text-red-500 text-sm">削除</button>
                </li>`;
            });
        });
    </script>
</body>
</html>
