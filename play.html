<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <title>脱出ゲームプレイ画面 - 恐怖の廃校</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="firebase-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        @font-face { font-family: 'OnryouFont'; src: url('home/onryu.ttf') format('truetype'), url('./home/onryu.ttf') format('truetype'), url('home/onryou.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
        body { font-family: 'OnryouFont', 'Shippori Mincho', serif; background-color: #030303; color: #d1d1d1; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .font-mono { font-family: 'Share Tech Mono', monospace !important; }
        .text-blood-dark { background: linear-gradient(180deg, #ff1a1a 0%, #b30000 40%, #4d0000 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(0,0,0,0.9)); }
        @keyframes alarmFlash { 0%, 100% { background-color: rgba(255, 0, 0, 0.4); } 50% { background-color: rgba(255, 0, 0, 0.85); } }
        .alarm-active { animation: alarmFlash 0.4s infinite; }
    </style>
</head>
<body class="relative p-6">

    <!-- ① 待機画面 -->
    <div id="waiting-screen" class="text-center w-full max-w-md z-20">
        <div id="leader-waiting" class="hidden">
            <h1 class="text-2xl sm:text-3xl font-bold text-red-500 mb-2 tracking-widest text-blood-dark">受付待機中</h1>
            <p class="text-gray-300 text-sm mb-4 leading-relaxed">
                この画面を受付スタッフに見せてください。<br>
                <span class="text-yellow-400 font-bold">スタッフが読み取ると自動でゲームが始まります！</span>
            </p>

            <div class="flex justify-center mb-3">
                <div id="reception-qrcode" class="p-4 bg-white rounded-2xl inline-block shadow-[0_0_25px_rgba(255,0,0,0.5)]"></div>
            </div>
            
            <div class="p-2 bg-gray-900 border border-red-900/60 rounded-lg inline-block mb-4">
                <p class="text-[11px] text-gray-400 font-sans">受付番号 (6桁ID)</p>
                <p id="leader-team-id" class="text-2xl font-mono text-red-400 font-bold tracking-[0.2em] pl-1"></p>
            </div>

            <!-- 音声テスト＆注意書き -->
            <button id="sound-btn" onclick="activateSound()" class="w-full bg-red-950 border border-red-700 text-red-200 py-3 rounded-lg text-xs tracking-wider shadow mb-2">
                🔊 タップして警告音テスト＆音量許可
            </button>
            <p class="text-[11px] text-yellow-400 font-sans font-bold">⚠️ アラームを最大音量で鳴らすため、スマホ本体の音量ボタンを【MAX】にしてください！</p>
        </div>

        <div id="member-waiting" class="hidden">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-red-600 mx-auto mb-6"></div>
            <h1 class="text-2xl font-bold text-red-500 mb-4 tracking-widest text-blood-dark">受付待機中</h1>
            <p class="text-gray-300 leading-relaxed text-sm">
                代表者が受付を行っています。<br>スタッフの開始合図があるまでお待ちください。
            </p>
        </div>
    </div>

    <!-- ② プレイ中画面 -->
    <div id="playing-screen" class="hidden w-full max-w-lg flex-col items-center justify-center h-full z-20">
        <div id="leader-view" class="hidden w-full text-center">
            <div class="bg-black/80 border border-red-900 p-6 rounded-lg shadow-[0_0_30px_rgba(255,0,0,0.2)] mb-6">
                <p class="text-sm text-gray-500 mb-2 tracking-widest">TEAM ESCAPE TIME</p>
                <div id="team-timer" class="text-6xl sm:text-7xl font-mono text-red-500 font-bold drop-shadow-[0_0_8px_#ff0000]">00:00.00</div>
            </div>
            <div id="hints-container" class="space-y-4 mb-4 text-left"></div>
            <button id="stop-alarm-btn" onclick="stopHorrorSiren()" class="hidden w-full bg-red-600 text-white py-6 rounded-lg font-bold text-3xl shadow-[0_0_25px_#ff0000] animate-pulse tracking-widest mt-8 border-4 border-red-400">🚨 サイレンを止める！</button>
        </div>

        <div id="member-view" class="hidden w-full text-center">
            <div class="bg-gray-900/50 border border-gray-700 p-8 rounded-lg shadow-lg mb-6">
                <p class="text-xl text-gray-400 leading-loose tracking-widest">※残り時間および脱出のヒントやサイレンは、<br><span class="text-red-500 font-bold">代表者の端末</span>のみ連動して作動します。</p>
            </div>
            <button onclick="forceSwitchToLeader()" class="text-xs text-red-400 border border-red-900/80 bg-red-950/60 px-6 py-3 rounded-full hover:bg-red-900 transition tracking-wider">
                自分が代表者の場合はここをタップ
            </button>
        </div>
    </div>

    <div id="alarm-overlay" class="fixed inset-0 pointer-events-none z-10 hidden alarm-active"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const teamId = urlParams.get('teamId');

        let isLeader = urlParams.get('role') === 'leader' || 
                       urlParams.get('leader') === 'true' || 
                       localStorage.getItem('isLeader_' + teamId) === 'true';

        if (isLeader) {
            document.getElementById('leader-waiting').style.display = 'block';
            document.getElementById('leader-team-id').innerText = teamId || '------';
            if (teamId) {
                new QRCode(document.getElementById("reception-qrcode"), {
                    text: teamId, width: 200, height: 200, colorDark: "#000000", colorLight: "#ffffff"
                });
            }
        } else {
            document.getElementById('member-waiting').style.display = 'block';
        }

        function forceSwitchToLeader() {
            isLeader = true;
            localStorage.setItem('isLeader_' + teamId, 'true');
            document.getElementById('member-view').style.display = 'none';
            document.getElementById('leader-view').style.display = 'block';
            initAudio();
        }

        let audioCtx; let alarmInterval; let compressor;
        let puzzleHints = []; let shownHints = new Set(); let isHintsLoaded = false;

        // 🔊 音圧コンプレッサーを組み込んだ爆音オーディオ初期化
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                
                // 💡 音圧を限界まで引き上げるコンプレッサー
                compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.setValueAtTime(-24, audioCtx.currentTime);
                compressor.knee.setValueAtTime(30, audioCtx.currentTime);
                compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
                compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
                compressor.release.setValueAtTime(0.25, audioCtx.currentTime);
                compressor.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function activateSound() {
            initAudio();
            const btn = document.getElementById('sound-btn');
            btn.innerText = "✅ 許可完了！スマホの音量ボタンを最大にしてください";
            btn.className = "w-full bg-green-950 border border-green-700 text-green-300 py-3 rounded-lg text-xs tracking-wider mb-2 font-bold";
        }

        // 🚨 限界音圧ホラーサイレン
        function playHorrorSiren() {
            document.getElementById('alarm-overlay').style.display = 'block'; 
            document.getElementById('stop-alarm-btn').style.display = 'block';
            initAudio();

            alarmInterval = setInterval(() => {
                const osc1 = audioCtx.createOscillator(); 
                const osc2 = audioCtx.createOscillator(); 
                const gain = audioCtx.createGain();
                
                osc1.type = 'sawtooth'; 
                osc2.type = 'square';
                
                // 不気味な不協和音
                osc1.frequency.setValueAtTime(850, audioCtx.currentTime); 
                osc1.frequency.exponentialRampToValueAtTime(550, audioCtx.currentTime + 0.35);
                osc2.frequency.setValueAtTime(900, audioCtx.currentTime); 
                osc2.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.35);
                
                // 💡 ゲイン（音量）を通常リミットの2.5倍に過変調させて爆音化
                gain.gain.setValueAtTime(0, audioCtx.currentTime); 
                gain.gain.linearRampToValueAtTime(2.5, audioCtx.currentTime + 0.05); 
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.45);
                
                osc1.connect(gain); 
                osc2.connect(gain); 
                gain.connect(compressor); // コンプレッサーへ接続
                
                osc1.start(); 
                osc2.start(); 
                osc1.stop(audioCtx.currentTime + 0.45); 
                osc2.stop(audioCtx.currentTime + 0.45);
            }, 500);
        }

        function stopHorrorSiren() {
            if (alarmInterval) clearInterval(alarmInterval);
            document.getElementById('alarm-overlay').style.display = 'none'; 
            document.getElementById('stop-alarm-btn').style.display = 'none';
        }

        let timerInterval;

        if (teamId) {
            db.collection('teams').doc(teamId).onSnapshot(async doc => {
                if(!doc.exists) return; const data = doc.data();
                
                if (data.status === 'playing') {
                    if (!isHintsLoaded && data.puzzleId) {
                        isHintsLoaded = true;
                        const pDoc = await db.collection('puzzles').doc(data.puzzleId).get();
                        if(pDoc.exists && pDoc.data().hints) puzzleHints = pDoc.data().hints;
                    }

                    document.getElementById('waiting-screen').style.display = 'none'; 
                    document.getElementById('playing-screen').style.display = 'flex';
                    
                    if (isLeader) {
                        document.getElementById('leader-view').style.display = 'block';
                        document.getElementById('member-view').style.display = 'none';
                    } else {
                        document.getElementById('member-view').style.display = 'block';
                        document.getElementById('leader-view').style.display = 'none';
                    }
                    
                    if(timerInterval) clearInterval(timerInterval);
                    
                    timerInterval = setInterval(() => {
                        let elapsed = data.accumulatedTime;
                        if (data.timerState === 'running') elapsed += (Date.now() - data.startTime);
                        document.getElementById('team-timer').innerText = formatTime(elapsed);
                        
                        if (isLeader) {
                            puzzleHints.forEach((event, idx) => {
                                if (elapsed >= event.timeMs && !shownHints.has(idx)) {
                                    shownHints.add(idx);
                                    if (event.type === 'alarm') {
                                        playHorrorSiren();
                                    } else {
                                        const container = document.getElementById('hints-container'); 
                                        const box = document.createElement('div');
                                        box.className = "bg-yellow-950/50 border border-yellow-700 text-yellow-300 p-4 rounded-lg shadow-lg text-left whitespace-pre-wrap animate-pulse";
                                        box.innerHTML = `<span class="font-bold text-white border-b border-yellow-600 block mb-2 pb-1">💡 ${event.timeMin}分経過 ヒント</span>${event.text}`;
                                        container.appendChild(box);
                                    }
                                }
                            });
                        }
                    }, 30);

                } else if (data.status === 'finished') {
                    if(timerInterval) clearInterval(timerInterval); stopHorrorSiren();
                    document.getElementById('playing-screen').innerHTML = `
                        <div class="text-center w-full">
                            <h1 class="text-4xl font-bold text-yellow-500 mb-6 drop-shadow-lg tracking-widest">脱出終了</h1>
                            <p class="text-xl mb-8 text-white">あなたのチームのタイムが記録されました。</p>
                            <a href="ranking.html" class="inline-block bg-red-900 border border-red-700 text-white px-8 py-4 rounded font-bold text-xl shadow-btn tracking-widest">ランキングを見る</a>
                        </div>
                    `;
                }
            });
        }

        function formatTime(ms) {
            const m = Math.floor(ms / 60000).toString().padStart(2, '0'); 
            const s = Math.floor((ms % 60000) / 1000).toString().padStart(2, '0'); 
            const c = Math.floor((ms % 1000) / 10).toString().padStart(2, '0'); 
            return `${m}:${s}.${c}`;
        }
    </script>
</body>
</html>
