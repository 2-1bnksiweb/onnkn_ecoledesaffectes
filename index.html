<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    
    <title>恐怖の廃校 - HOME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;900&family=Yuji+Boku&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'OnryouFont';
            src: url('home/onryu.ttf') format('truetype'),
                 url('./home/onryu.ttf') format('truetype'),
                 url('home/onryou.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        *, *::before, *::after, body, h1, h2, h3, p, span, a, button, input, div, header, rt, ruby { 
            font-family: 'OnryouFont', 'Yuji Boku', 'Shippori Mincho', serif !important; 
        }

        body { 
            background-color: #030303; 
            color: #d1d1d1; 
            overflow-x: hidden; 
            min-height: 100dvh; 
        }

        /* 🩸 ドス黒い血の文字 */
        .text-blood-dark {
            color: #850606;
            text-shadow: 2px 2px 4px #000000, 0 0 12px #4a0000, 0 0 25px #200000;
        }
        
        .sub-blood-dark {
            color: #610000;
            text-shadow: 1px 1px 2px #000;
        }

        /* オープニング */
        #opening { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            overflow: hidden; display: flex; flex-direction: column; 
        }
        
        .hand-wrapper { 
            position: absolute; 
            pointer-events: none;
            z-index: 9999;
        }
        
        .hand-img { 
            width: 100%; 
            height: auto;
            opacity: 0; 
            transform: scale(0.6); 
            animation: stampIn 0.08s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; 
            filter: drop-shadow(0px 0px 8px rgba(180, 0, 0, 0.8));
        }
        @keyframes stampIn { 
            to { 
                opacity: 0.95; 
                transform: scale(1); 
            } 
        }
        
        #blood-screen { 
            position: absolute; inset: 0; background: #500000; 
            opacity: 0; transition: opacity 0.2s; z-index: 10000; 
            pointer-events: none;
        }

        .shadow-btn { box-shadow: 0 4px 15px rgba(80, 0, 0, 0.7); }
    </style>
</head>
<body class="relative">

    <!-- 🩸 SVGフィルター定義（血のドロドロ＆トゲトゲの質感を生成） -->
    <svg class="hidden" width="0" height="0">
        <defs>
            <filter id="horror-blood-filter" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
            </filter>
            <filter id="splatter-filter" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <!-- ========================================================
         🩸 1枚目画像再現：上部＆左右の重厚な「血のカーテン」
         ======================================================== -->
    <svg class="fixed top-0 left-0 w-full pointer-events-none z-20 h-40 sm:h-56 opacity-90" viewBox="0 0 1000 240" preserveAspectRatio="none">
        <g filter="url(#horror-blood-filter)">
            <!-- 暗い血のベース（奥） -->
            <path d="M0,0 L1000,0 L1000,45 
                     Q970,180 950,50 Q920,230 900,60 Q860,110 830,40 Q790,210 770,50 
                     Q720,130 690,45 Q640,240 620,55 Q580,110 550,45 Q510,220 480,45 
                     Q430,140 400,45 Q360,230 330,55 Q290,110 260,40 Q210,240 190,55 
                     Q150,150 120,45 Q80,220 60,60 Q30,120 0,50 Z" fill="#380000" />
            
            <!-- 鮮血の垂れ（手前レイヤー） -->
            <path d="M0,0 L1000,0 L1000,30 
                     Q965,140 945,35 Q915,190 895,45 Q855,90 825,30 Q785,170 765,40 
                     Q715,100 685,35 Q635,200 615,45 Q575,90 545,35 Q505,180 475,35 
                     Q425,110 395,35 Q355,190 325,45 Q285,90 255,30 Q205,200 185,45 
                     Q145,120 115,35 Q75,180 55,45 Q25,95 0,35 Z" fill="#6e0202" />

            <!-- 細く深く滴り落ちる血の筋 -->
            <path d="M60,60 L58,210 M190,55 L188,235 M330,55 L328,215 M480,45 L482,210 M620,55 L618,225 M770,50 L768,205 M900,60 L898,220" stroke="#7a0202" stroke-width="4" stroke-linecap="round" />
            <path d="M120,45 L121,170 M260,40 L259,150 M400,45 L399,160 M550,45 L551,145 M690,45 L689,165 M830,40 L831,140 M950,50 L949,175" stroke="#4a0000" stroke-width="3" stroke-linecap="round" />
            
            <!-- 滴る雫 -->
            <circle cx="58" cy="216" r="3.5" fill="#7a0202" />
            <circle cx="188" cy="242" r="4" fill="#7a0202" />
            <circle cx="328" cy="222" r="3.5" fill="#7a0202" />
            <circle cx="482" cy="216" r="3.5" fill="#7a0202" />
            <circle cx="618" cy="232" r="4" fill="#7a0202" />
            <circle cx="768" cy="212" r="3.5" fill="#7a0202" />
            <circle cx="898" cy="227" r="4" fill="#7a0202" />
        </g>
    </svg>

    <!-- ========================================================
         🩸 2枚目画像再現：四隅＆周囲の激しい「スプラッター血飛沫」
         ======================================================== -->
    <!-- ① 左上スプラッター -->
    <svg class="fixed top-0 left-0 w-64 h-64 pointer-events-none z-10 opacity-75" viewBox="0 0 250 250">
        <g filter="url(#splatter-filter)" fill="#750202">
            <!-- ギザギザの中心血塊 -->
            <path d="M40,30 Q90,10 120,40 Q150,20 130,70 Q160,110 110,120 Q120,160 70,130 Q30,170 40,110 Q0,80 40,30 Z" />
            <path d="M110,60 Q170,40 180,90 Q150,110 110,60 Z" fill="#4d0000" />
            <!-- 周囲に無数に飛び散る飛沫 -->
            <circle cx="150" cy="30" r="5" /><circle cx="175" cy="45" r="3.5" /><circle cx="195" cy="30" r="2" />
            <circle cx="145" cy="135" r="6" /><circle cx="170" cy="160" r="4" /><circle cx="185" cy="180" r="2.5" />
            <circle cx="65" cy="155" r="5.5" /><circle cx="80" cy="185" r="3" /><circle cx="50" cy="205" r="4" /><circle cx="35" cy="225" r="2" />
            <circle cx="210" cy="85" r="4.5" /><circle cx="230" cy="100" r="2.5" />
        </g>
    </svg>

    <!-- ② 右上スプラッター -->
    <svg class="fixed top-0 right-0 w-64 h-64 pointer-events-none z-10 opacity-75" viewBox="0 0 250 250">
        <g filter="url(#splatter-filter)" fill="#750202" transform="scale(-1, 1) translate(-250, 0)">
            <path d="M40,30 Q90,10 120,40 Q150,20 130,70 Q160,110 110,120 Q120,160 70,130 Q30,170 40,110 Q0,80 40,30 Z" />
            <circle cx="150" cy="30" r="5" /><circle cx="175" cy="45" r="3.5" />
            <circle cx="145" cy="135" r="6" /><circle cx="170" cy="160" r="4" /><circle cx="185" cy="180" r="2.5" />
            <circle cx="65" cy="155" r="5.5" /><circle cx="80" cy="185" r="3" />
        </g>
    </svg>

    <!-- ③ 左下スプラッター -->
    <svg class="fixed bottom-0 left-0 w-72 h-72 pointer-events-none z-10 opacity-75" viewBox="0 0 250 250">
        <g filter="url(#splatter-filter)" fill="#700202" transform="scale(1, -1) translate(0, -250)">
            <path d="M50,40 Q100,15 130,50 Q165,30 140,85 Q175,130 120,135 Q130,175 80,140 Q35,185 45,120 Q0,90 50,40 Z" />
            <circle cx="160" cy="40" r="5.5" /><circle cx="185" cy="55" r="3" /><circle cx="210" cy="40" r="2" />
            <circle cx="150" cy="145" r="7" /><circle cx="180" cy="175" r="4.5" /><circle cx="200" cy="195" r="3" /><circle cx="220" cy="215" r="2" />
            <circle cx="70" cy="165" r="6" /><circle cx="90" cy="195" r="3.5" /><circle cx="60" cy="215" r="4" />
        </g>
    </svg>

    <!-- ④ 右下スプラッター -->
    <svg class="fixed bottom-0 right-0 w-72 h-72 pointer-events-none z-10 opacity-75" viewBox="0 0 250 250">
        <g filter="url(#splatter-filter)" fill="#700202" transform="scale(-1, -1) translate(-250, -250)">
            <path d="M50,40 Q100,15 130,50 Q165,30 140,85 Q175,130 120,135 Q130,175 80,140 Q35,185 45,120 Q0,90 50,40 Z" />
            <circle cx="160" cy="40" r="5.5" /><circle cx="185" cy="55" r="3" />
            <circle cx="150" cy="145" r="7" /><circle cx="180" cy="175" r="4.5" /><circle cx="200" cy="195" r="3" />
            <circle cx="70" cy="165" r="6" /><circle cx="90" cy="195" r="3.5" />
        </g>
    </svg>

    <!-- オープニングレイヤー -->
    <div id="opening">
        <div id="blood-screen"></div>
    </div>

    <!-- メインコンテンツ -->
    <div id="main-content" class="max-w-md mx-auto p-6 min-h-[100dvh] relative opacity-0 transition-opacity duration-700 flex flex-col justify-center z-30">
        
        <!-- ヘッダー -->
        <header class="flex justify-between items-center border-b border-red-950 pb-3 mb-8 text-gray-500 absolute top-8 left-6 right-6 z-30">
            <span class="tracking-widest text-lg">2-1 教室発表</span>
            <button onclick="toggleMenu()" class="text-3xl hover:text-white">☰</button>
        </header>

        <!-- メニュー -->
        <div id="nav-menu" class="hidden flex-col bg-gray-950 p-4 rounded border border-red-950 mb-6 space-y-3 text-base absolute top-20 right-6 z-50">
            <a href="timeattack.html" class="text-red-700 hover:text-red-500">✝ スタッフ用: タイム計測＆謎発動</a>
            <a href="admin.html" class="text-red-700 hover:text-red-500">✝ 管理者設定</a>
        </div>

        <!-- タイトルエリア（ルビ付き・ドス黒い赤） -->
        <div class="text-center mb-10 mt-20 relative">
            <h1 class="text-4xl sm:text-5xl font-black tracking-widest text-blood-dark mb-2 leading-relaxed relative z-10" id="story-title">
                <ruby>恐怖<rt class="text-xs sm:text-sm sub-blood-dark tracking-widest">おののき</rt></ruby>の<ruby>廃校<rt class="text-xs sm:text-sm sub-blood-dark tracking-widest">エコールデザフェクテ</rt></ruby>
            </h1>
        </div>

        <!-- あらすじエリア -->
        <div class="mb-10 text-center flex-1 relative">
            <p class="text-blood-dark mb-4 text-2xl tracking-widest">〜 あらすじ 〜</p>
            
            <svg class="w-full h-5 text-red-950 mb-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 200 15" preserveAspectRatio="none">
                <path d="M0,7 Q25,0 50,7 T100,7 T150,7 T200,7" stroke-width="1.5"></path>
                <circle cx="75" cy="11" r="1.5" fill="currentColor" stroke="none" />
                <circle cx="140" cy="12" r="2" fill="currentColor" stroke="none" />
            </svg>
            
            <p id="story-text" class="text-xl text-gray-400 leading-loose px-4">
                読込中...
            </p>
            
            <svg class="w-full h-5 text-red-950 mt-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 200 15" preserveAspectRatio="none">
                <path d="M0,7 Q25,14 50,7 T100,7 T150,7 T200,7" stroke-width="1.5"></path>
                <circle cx="45" cy="12" r="1.8" fill="currentColor" stroke="none" />
                <circle cx="165" cy="11" r="1.5" fill="currentColor" stroke="none" />
            </svg>
        </div>

        <!-- 予約ボタンエリア -->
        <div class="mb-8 text-center px-2 relative">
            <h2 class="text-2xl text-blood-dark mb-4 tracking-widest font-bold">予約</h2>
            <p class="text-base text-gray-500 mb-1">下のボタンから予約をすることができます。</p>
            <p class="text-base text-gray-500 mb-3">前日でも当日でも予約可能です。</p>
            <a href="#" class="inline-block mb-4 text-base text-red-700 hover:text-red-500 underline decoration-red-900">詳しいやり方、注意点はこちらから</a>
            
            <div class="relative">
                <a href="ticket.html" class="block w-full py-4 bg-[#260101] border border-[#520202] text-blood-dark text-2xl hover:bg-black transition tracking-widest shadow-btn relative z-10">
                    予約 はこちらから
                </a>
                <svg class="w-full h-4 text-[#520202] -mt-1 relative z-0 opacity-80" viewBox="0 0 300 20" preserveAspectRatio="none" fill="currentColor">
                    <path d="M20,0 Q30,18 40,0 M140,0 Q150,22 160,0 M240,0 Q250,16 260,0" />
                    <circle cx="40" cy="18" r="1.5" />
                    <circle cx="150" cy="22" r="2" />
                    <circle cx="250" cy="16" r="1.5" />
                </svg>
            </div>
        </div>

        <!-- ランキングボタンエリア -->
        <div class="mb-4 text-center px-2">
            <h2 class="text-2xl text-blood-dark mb-4 tracking-widest font-bold">ランキング</h2>
            <p class="text-base text-gray-500 mb-4">上位TOP3まで表示されます</p>
            <a href="ranking.html" class="block w-full py-4 bg-gray-950 border border-gray-800 text-gray-400 text-xl hover:bg-gray-900 transition tracking-widest">
                ランキングはこちらから
            </a>
        </div>
    </div>

    <script>
        try {
            db.collection('settings').doc('config').onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    if (data.storyText) {
                        document.getElementById('story-text').innerHTML = data.storyText.replace(/\n/g, '<br>');
                    }
                }
            });
        } catch (e) {}

        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        // 🩸 拍子木リズム・オープニング
        window.onload = () => {
            const opening = document.getElementById('opening');
            const bloodScreen = document.getElementById('blood-screen');
            const mainContent = document.getElementById('main-content');
            
            let count = 0;
            const maxCount = 220; 

            function stampOne(isCenter = false) {
                const wrapper = document.createElement('div');
                wrapper.className = 'hand-wrapper';
                
                const size = 160 + (Math.random() * 220); 
                wrapper.style.width = `${size}px`;
                
                const rotate = Math.floor(Math.random() * 360); 
                const flip = Math.random() > 0.5 ? -1 : 1; 
                
                let x, y;
                if (isCenter) {
                    x = 22 + (Math.random() * 32); 
                    y = 22 + (Math.random() * 32); 
                } else {
                    x = -2 + (Math.random() * 84); 
                    y = -2 + (Math.random() * 84); 
                }
                
                wrapper.style.left = `${x}%`;
                wrapper.style.top = `${y}%`;
                wrapper.style.transform = `rotate(${rotate}deg) scaleX(${flip})`;
                
                const img = document.createElement('img');
                img.src = 'home/hand.png'; 
                img.className = 'hand-img';
                
                wrapper.appendChild(img);
                opening.appendChild(wrapper);
            }

            function runLoop() {
                let batchSize = 1;
                let nextDelay = 850;

                if (count < 15) {
                    nextDelay = Math.max(70, Math.floor(850 * Math.pow(0.85, count)));
                    batchSize = 1;
                } else if (count < 50) {
                    const p = (count - 15) / (50 - 15);
                    nextDelay = Math.max(15, Math.floor(65 - (p * 45)));
                    batchSize = Math.floor(1 + (p * 2));
                } else {
                    const p = (count - 50) / (maxCount - 50);
                    nextDelay = 12;
                    batchSize = Math.min(maxCount - count, Math.floor(4 + (p * 12)));
                }

                for (let i = 0; i < batchSize; i++) {
                    if (count >= maxCount) break;
                    stampOne(count < 7);
                    count++;
                }

                if (count < maxCount) {
                    setTimeout(runLoop, nextDelay);
                } else {
                    bloodScreen.style.opacity = '1';
                    setTimeout(() => {
                        opening.style.transition = "transform 2.0s cubic-bezier(0.4, 0, 0.8, 0.3), border-radius 2.0s";
                        opening.style.transform = "translateY(100%)";
                        opening.style.borderTopLeftRadius = "50% 15%";
                        opening.style.borderTopRightRadius = "50% 15%";
                        
                        mainContent.style.opacity = '1';
                        setTimeout(() => { opening.style.display = 'none'; }, 2000);
                    }, 250);
                }
            }

            setTimeout(runLoop, 150);
        };
    </script>
</body>
</html>
