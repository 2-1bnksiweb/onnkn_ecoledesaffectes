<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    
    <title>恐怖の廃校 - HOME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;900&family=Yuji+Boku&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'OnryouFont';
            src: url('home/onryu.ttf') format('truetype'),
                 url('./home/onryu.ttf') format('truetype'),
                 url('home/onryou.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        *, *::before, *::after, body, h1, h2, h3, p, span, a, button, input, div, header, rt, ruby { 
            font-family: 'OnryouFont', 'Yuji Boku', 'Shippori Mincho', serif !important; 
        }

        body { 
            background-color: #030303; 
            color: #e0e0e0; 
            overflow-x: hidden; 
            min-height: 100dvh; 
        }

        /* 🩸 ドス黒い血の文字 */
        .text-blood-dark {
            color: #8c0808;
            text-shadow: 2px 2px 4px #000000, 0 0 12px #4a0000, 0 0 25px #000000;
        }
        
        .sub-blood-dark {
            color: #6e0202;
            text-shadow: 1px 1px 2px #000;
        }

        /* オープニング */
        #opening { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            overflow: hidden; display: flex; flex-direction: column; 
        }
        
        .hand-wrapper { 
            position: absolute; 
            pointer-events: none;
            z-index: 9999;
        }
        
        .hand-img { 
            width: 100%; 
            height: auto;
            opacity: 0; 
            transform: scale(0.6); 
            animation: stampIn 0.08s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; 
            filter: drop-shadow(0px 0px 8px rgba(180, 0, 0, 0.8));
        }
        @keyframes stampIn { 
            to { 
                opacity: 0.95; 
                transform: scale(1); 
            } 
        }
        
        #blood-screen { 
            position: absolute; inset: 0; background: #500000; 
            opacity: 0; transition: opacity 0.2s; z-index: 10000; 
            pointer-events: none;
        }

        .shadow-btn { box-shadow: 0 4px 15px rgba(80, 0, 0, 0.7); }
    </style>
</head>
