<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    
    <title>恐怖の廃校 - HOME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;900&family=Yuji+Boku&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'OnryouFont';
            src: url('home/onryu.ttf') format('truetype'),
                 url('./home/onryu.ttf') format('truetype'),
                 url('home/onryou.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* 怨霊フォントの統一 */
        *, *::before, *::after, body, h1, h2, h3, p, span, a, button, input, div, header, rt, ruby { 
            font-family: 'OnryouFont', 'Yuji Boku', 'Shippori Mincho', serif !important; 
        }

        body { 
            background-color: #040404; 
            color: #d1d1d1; 
            overflow-x: hidden; 
            min-height: 100dvh; 
        }

        /* 🩸 ドス黒い血の文字 */
        .text-blood-dark {
            color: #850606;
            text-shadow: 2px 2px 4px #000000, 0 0 12px #4a0000, 0 0 25px #200000;
        }
        
        .sub-blood-dark {
            color: #610000;
            text-shadow: 1px 1px 2px #000;
        }

        /* オープニング */
        #opening { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            overflow: hidden; display: flex; flex-direction: column; 
        }
        
        .hand-wrapper { 
            position: absolute; 
            pointer-events: none;
            z-index: 9999;
        }
        
        .hand-img { 
            width: 100%; 
            height: auto;
            opacity: 0; 
            transform: scale(0.6); 
            animation: stampIn 0.08s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; 
            filter: drop-shadow(0px 0px 8px rgba(180, 0, 0, 0.8));
        }
        @keyframes stampIn { 
            to { 
                opacity: 0.95; 
                transform: scale(1); 
            } 
        }
        
        #blood-screen { 
            position: absolute; inset: 0; background: #500000; 
            opacity: 0; transition: opacity 0.2s; z-index: 10000; 
            pointer-events: none;
        }

        /* 装飾血痕 */
        .blood-svg {
            position: absolute;
            pointer-events: none;
            filter: drop-shadow(0 0 6px #200);
        }

        .shadow-btn { box-shadow: 0 4px 15px rgba(80, 0, 0, 0.7); }
    </style>
</head>
<body class="relative">

    <!-- 画面上端から常時ドロリと垂れ下がる血 -->
    <svg class="fixed top-0 left-0 w-full pointer-events-none z-20 h-12 sm:h-20 text-[#420202] opacity-80" viewBox="0 0 1000 120" preserveAspectRatio="none" fill="currentColor">
        <path d="M0,0 L1000,0 L1000,30 Q960,85 940,30 Q910,110 890,30 Q850,50 820,20 Q780,120 760,25 Q710,70 680,20 Q640,115 620,30 Q580,60 550,25 Q510,120 480,20 Q440,75 410,25 Q370,110 340,30 Q300,60 270,20 Q220,120 200,30 Q160,80 130,20 Q90,115 70,30 Q40,65 0,25 Z" />
        <circle cx="760" cy="125" r="3" />
        <circle cx="480" cy="126" r="3.5" />
        <circle cx="200" cy="125" r="3" />
        <circle cx="620" cy="120" r="2.5" />
    </svg>

    <!-- オープニングレイヤー -->
    <div id="opening">
        <div id="blood-screen"></div>
    </div>

    <!-- メインコンテンツ -->
    <div id="main-content" class="max-w-md mx-auto p-6 min-h-[100dvh] relative opacity-0 transition-opacity duration-700 flex flex-col justify-center">
        
        <!-- 🩸 背景の飛び散り血痕（スプラッター） -->
        <!-- 左上の生々しい飛沫 -->
        <svg class="blood-svg w-48 h-48 -top-6 -left-10 text-[#4a0202] opacity-40" viewBox="0 0 200 200" fill="currentColor">
            <path d="M80,90 Q90,60 110,70 Q130,80 120,110 Q110,140 80,130 Q50,120 60,95 Z" />
            <circle cx="140" cy="60" r="6" /><circle cx="160" cy="45" r="3" /><circle cx="175" cy="35" r="2" />
            <circle cx="50" cy="60" r="5" /><circle cx="35" cy="45" r="3" /><circle cx="110" cy="155" r="7" />
            <circle cx="120" cy="175" r="4" /><circle cx="125" cy="190" r="2" />
        </svg>

        <!-- 右下の滲んだ血痕 -->
        <svg class="blood-svg w-64 h-64 -bottom-10 -right-16 text-[#3b0000] opacity-35" viewBox="0 0 200 200" fill="currentColor">
            <path d="M100,70 C140,50 170,90 150,130 C130,170 70,160 60,120 C50,80 70,80 100,70 Z" />
            <circle cx="40" cy="140" r="8" /><circle cx="25" cy="155" r="4" /><circle cx="15" cy="165" r="2" />
            <circle cx="165" cy="80" r="6" /><circle cx="180" cy="70" r="3" />
        </svg>

        <!-- ヘッダー -->
        <header class="flex justify-between items-center border-b border-red-950 pb-3 mb-8 text-gray-500 absolute top-8 left-6 right-6 z-30">
            <span class="tracking-widest text-lg">2-1 教室発表</span>
            <button onclick="toggleMenu()" class="text-3xl hover:text-white">☰</button>
        </header>

        <!-- メニュー -->
        <div id="nav-menu" class="hidden flex-col bg-gray-950 p-4 rounded border border-red-950 mb-6 space-y-3 text-base absolute top-20 right-6 z-50">
            <a href="timeattack.html" class="text-red-700 hover:text-red-500">✝ スタッフ用: タイム計測＆謎発動</a>
            <a href="admin.html" class="text-red-700 hover:text-red-500">✝ 管理者設定</a>
        </div>

        <!-- タイトルエリア（背後に飛び散る血痕付き） -->
        <div class="text-center mb-10 mt-20 relative">
            <!-- タイトル背後の血飛沫 -->
            <svg class="blood-svg w-72 h-36 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[#4f0000] opacity-30" viewBox="0 0 300 150" fill="currentColor">
                <path d="M50,75 Q90,30 150,60 Q210,30 250,75 Q210,120 150,90 Q90,120 50,75 Z" />
                <circle cx="270" cy="40" r="5" /><circle cx="285" cy="25" r="3" />
                <circle cx="30" cy="110" r="6" /><circle cx="15" cy="130" r="3" />
            </svg>

            <h1 class="text-4xl sm:text-5xl font-black tracking-widest text-blood-dark mb-2 leading-relaxed relative z-10" id="story-title">
                <ruby>恐怖<rt class="text-xs sm:text-sm sub-blood-dark tracking-widest">おののき</rt></ruby>の<ruby>廃校<rt class="text-xs sm:text-sm sub-blood-dark tracking-widest">エコールデザフェクテ</rt></ruby>
            </h1>
        </div>

        <!-- あらすじエリア -->
        <div class="mb-10 text-center flex-1 relative">
            <p class="text-blood-dark mb-4 text-2xl tracking-widest">〜 あらすじ 〜</p>
            
            <!-- 血の波線（上） -->
            <svg class="w-full h-5 text-red-950 mb-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 200 15" preserveAspectRatio="none">
                <path d="M0,7 Q25,0 50,7 T100,7 T150,7 T200,7" stroke-width="1.5"></path>
                <circle cx="75" cy="11" r="1.5" fill="currentColor" stroke="none" />
                <circle cx="140" cy="12" r="2" fill="currentColor" stroke="none" />
            </svg>
            
            <p id="story-text" class="text-xl text-gray-400 leading-loose px-4">
                読込中...
            </p>
            
            <!-- 血の波線（下） -->
            <svg class="w-full h-5 text-red-950 mt-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 200 15" preserveAspectRatio="none">
                <path d="M0,7 Q25,14 50,7 T100,7 T150,7 T200,7" stroke-width="1.5"></path>
                <circle cx="45" cy="12" r="1.8" fill="currentColor" stroke="none" />
                <circle cx="165" cy="11" r="1.5" fill="currentColor" stroke="none" />
            </svg>
        </div>

        <!-- 予約ボタンエリア（下部に滴る血付き） -->
        <div class="mb-8 text-center px-2 relative">
            <h2 class="text-2xl text-blood-dark mb-4 tracking-widest font-bold">予約</h2>
            <p class="text-base text-gray-500 mb-1">下のボタンから予約をすることができます。</p>
            <p class="text-base text-gray-500 mb-3">前日でも当日でも予約可能です。</p>
            <a href="#" class="inline-block mb-4 text-base text-red-700 hover:text-red-500 underline decoration-red-900">詳しいやり方、注意点はこちらから</a>
            
            <div class="relative">
                <a href="ticket.html" class="block w-full py-4 bg-[#2e0101] border border-[#5c0303] text-blood-dark text-2xl hover:bg-black transition tracking-widest shadow-btn relative z-10">
                    予約 はこちらから
                </a>
                <!-- ボタンの底から滴る血 -->
                <svg class="w-full h-4 text-[#5c0303] -mt-1 relative z-0 opacity-80" viewBox="0 0 300 20" preserveAspectRatio="none" fill="currentColor">
                    <path d="M20,0 Q30,18 40,0 M140,0 Q150,22 160,0 M240,0 Q250,16 260,0" />
                    <circle cx="40" cy="18" r="1.5" />
                    <circle cx="150" cy="22" r="2" />
                    <circle cx="250" cy="16" r="1.5" />
                </svg>
            </div>
        </div>

        <!-- ランキングボタンエリア -->
        <div class="mb-4 text-center px-2">
            <h2 class="text-2xl text-blood-dark mb-4 tracking-widest font-bold">ランキング</h2>
            <p class="text-base text-gray-500 mb-4">上位TOP3まで表示されます</p>
            <a href="ranking.html" class="block w-full py-4 bg-gray-950 border border-gray-800 text-gray-400 text-xl hover:bg-gray-900 transition tracking-widest">
                ランキングはこちらから
            </a>
        </div>
    </div>

    <script>
        try {
            db.collection('settings').doc('config').onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    if (data.storyText) {
                        document.getElementById('story-text').innerHTML = data.storyText.replace(/\n/g, '<br>');
                    }
                }
            });
        } catch (e) {}

        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        // 🩸 拍子木リズム・オープニング
        window.onload = () => {
            const opening = document.getElementById('opening');
            const bloodScreen = document.getElementById('blood-screen');
            const mainContent = document.getElementById('main-content');
            
            let count = 0;
            const maxCount = 220; 

            function stampOne(isCenter = false) {
                const wrapper = document.createElement('div');
                wrapper.className = 'hand-wrapper';
                
                const size = 160 + (Math.random() * 220); 
                wrapper.style.width = `${size}px`;
                
                const rotate = Math.floor(Math.random() * 360); 
                const flip = Math.random() > 0.5 ? -1 : 1; 
                
                let x, y;
                if (isCenter) {
                    x = 22 + (Math.random() * 32); 
                    y = 22 + (Math.random() * 32); 
                } else {
                    x = -2 + (Math.random() * 84); 
                    y = -2 + (Math.random() * 84); 
                }
                
                wrapper.style.left = `${x}%`;
                wrapper.style.top = `${y}%`;
                wrapper.style.transform = `rotate(${rotate}deg) scaleX(${flip})`;
                
                const img = document.createElement('img');
                img.src = 'home/hand.png'; 
                img.className = 'hand-img';
                
                wrapper.appendChild(img);
                opening.appendChild(wrapper);
            }

            function runLoop() {
                let batchSize = 1;
                let nextDelay = 850;

                if (count < 15) {
                    nextDelay = Math.max(70, Math.floor(850 * Math.pow(0.85, count)));
                    batchSize = 1;
                } else if (count < 50) {
                    const p = (count - 15) / (50 - 15);
                    nextDelay = Math.max(15, Math.floor(65 - (p * 45)));
                    batchSize = Math.floor(1 + (p * 2));
                } else {
                    const p = (count - 50) / (maxCount - 50);
                    nextDelay = 12;
                    batchSize = Math.min(maxCount - count, Math.floor(4 + (p * 12)));
                }

                for (let i = 0; i < batchSize; i++) {
                    if (count >= maxCount) break;
                    stampOne(count < 7);
                    count++;
                }

                if (count < maxCount) {
                    setTimeout(runLoop, nextDelay);
                } else {
                    bloodScreen.style.opacity = '1';
                    setTimeout(() => {
                        opening.style.transition = "transform 2.0s cubic-bezier(0.4, 0, 0.8, 0.3), border-radius 2.0s";
                        opening.style.transform = "translateY(100%)";
                        opening.style.borderTopLeftRadius = "50% 15%";
                        opening.style.borderTopRightRadius = "50% 15%";
                        
                        mainContent.style.opacity = '1';
                        setTimeout(() => { opening.style.display = 'none'; }, 2000);
                    }, 250);
                }
            }

            setTimeout(runLoop, 150);
        };
    </script>
</body>
</html>
