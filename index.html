<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    
    <title>恐怖の廃校 - HOME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;900&family=Yuji+Boku&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'OnryouFont';
            src: url('home/onryu.ttf') format('truetype'),
                 url('./home/onryu.ttf') format('truetype'),
                 url('home/onryou.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body, h1, h2, p, span, a, button { 
            font-family: 'OnryouFont', 'Yuji Boku', 'Shippori Mincho', serif !important; 
        }

        body { 
            background-color: #050505; 
            color: #e5e5e5; 
            overflow-x: hidden; 
            min-height: 100dvh; 
        }

        #opening { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            overflow: hidden; display: flex; flex-direction: column; 
        }
        
        .hand-wrapper { 
            position: absolute; 
            pointer-events: none;
            z-index: 9999;
        }
        
        .hand-img { 
            width: 100%; 
            height: auto;
            opacity: 0; 
            transform: scale(0.6); 
            animation: stampIn 0.08s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; 
            filter: drop-shadow(0px 0px 8px rgba(255, 0, 0, 0.8));
        }
        @keyframes stampIn { 
            to { 
                opacity: 0.95; 
                transform: scale(1); 
            } 
        }
        
        #blood-screen { 
            position: absolute; inset: 0; background: #660000; 
            opacity: 0; transition: opacity 0.2s; z-index: 10000; 
            pointer-events: none;
        }

        .blood-splatter { 
            position: absolute; 
            background-image: radial-gradient(circle, #5a0000 0%, transparent 60%); 
            opacity: 0.25; border-radius: 50%; pointer-events: none; z-index: -1; 
        }
        .shadow-red { text-shadow: 0 0 15px #ff0000; }
        .shadow-btn { box-shadow: 0 4px 15px rgba(136, 0, 0, 0.5); }
    </style>
</head>
<body class="relative">

    <div id="opening">
        <div id="blood-screen"></div>
    </div>

    <div id="main-content" class="max-w-md mx-auto p-6 min-h-[100dvh] relative opacity-0 transition-opacity duration-700 flex flex-col justify-center">
        
        <div class="blood-splatter w-64 h-64 top-10 -left-10"></div>
        <div class="blood-splatter w-80 h-80 bottom-10 -right-20"></div>

        <header class="flex justify-between items-center border-b border-red-900 pb-3 mb-8 text-gray-400 absolute top-6 left-6 right-6">
            <span class="tracking-widest">2-1 教室発表</span>
            <button onclick="toggleMenu()" class="text-3xl hover:text-white">☰</button>
        </header>

        <div id="nav-menu" class="hidden flex-col bg-gray-900 p-4 rounded border border-red-900 mb-6 space-y-3 text-sm absolute top-20 right-6 z-50">
            <a href="timeattack.html" class="text-red-400 hover:text-red-300">✝ スタッフ用: タイム計測＆謎発動</a>
            <a href="admin.html" class="text-red-400 hover:text-red-300">✝ 管理者設定</a>
        </div>

        <div class="text-center mb-10 mt-16">
            <div class="flex justify-center space-x-6 text-xs text-red-600 mb-2 tracking-widest font-bold">
                <span>おののけ</span>
                <span>エコールデサフェクテ</span>
            </div>
            <h1 class="text-5xl font-black text-white tracking-widest shadow-red mb-2" id="story-title">恐怖の廃校</h1>
        </div>

        <div class="mb-10 text-center flex-1">
            <p class="text-red-500 mb-4 text-lg">〜 あらすじ 〜</p>
            <svg class="w-full h-4 text-red-900 mb-4" fill="none" stroke="currentColor" viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M0,5 Q25,0 50,5 T100,5 T150,5 T200,5" stroke-width="1"></path></svg>
            
            <p id="story-text" class="text-xl text-gray-300 leading-loose px-4">
                読込中...
            </p>
            
            <svg class="w-full h-4 text-red-900 mt-4" fill="none" stroke="currentColor" viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M0,5 Q25,10 50,5 T100,5 T150,5 T200,5" stroke-width="1"></path></svg>
        </div>

        <div class="mb-8 text-center px-2">
            <h2 class="text-2xl text-red-500 mb-4 tracking-widest font-bold">予約</h2>
            <p class="text-sm text-gray-400 mb-1">下のボタンから予約をすることができます。</p>
            <p class="text-sm text-gray-400 mb-3">前日でも当日でも予約可能です。</p>
            <a href="#" class="inline-block mb-4 text-sm text-blue-500 hover:text-blue-400 underline decoration-blue-500">詳しいやり方、注意点はこちらから</a>
            
            <a href="ticket.html" class="block w-full py-4 bg-red-900 border border-red-700 text-white text-2xl hover:bg-red-800 transition tracking-widest shadow-btn">
                予約 はこちらから
            </a>
        </div>

        <div class="mb-4 text-center px-2">
            <h2 class="text-2xl text-red-500 mb-4 tracking-widest font-bold">ランキング</h2>
            <p class="text-sm text-gray-400 mb-4">上位TOP3まで表示されます</p>
            <a href="ranking.html" class="block w-full py-4 bg-gray-800 border border-gray-600 text-white text-xl hover:bg-gray-700 transition tracking-widest">
                ランキングはこちらから
            </a>
        </div>
    </div>

    <script>
        try {
            db.collection('settings').doc('config').onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    document.getElementById('story-title').innerText = data.storyTitle || "恐怖の廃校";
                    document.getElementById('story-text').innerHTML = (data.storyText || "怨念渦巻く廃校に迷い込んでしまったあなた達...。\n制限時間内に謎を解き、最速タイムで脱出せよ！").replace(/\n/g, '<br>');
                }
            });
        } catch (e) {}

        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        // ========================================================
        // 🩸 遅 ▶ 中 ▶ 早 ▶ バズーカ（4段階加速アニメーション）
        // ========================================================
        window.onload = () => {
            const opening = document.getElementById('opening');
            const bloodScreen = document.getElementById('blood-screen');
            const mainContent = document.getElementById('main-content');
            
            let count = 0;
            const maxCount = 200;

            function stampOne(isCenter = false) {
                const wrapper = document.createElement('div');
                wrapper.className = 'hand-wrapper';
                
                const size = 170 + (Math.random() * 250); 
                wrapper.style.width = `${size}px`;
                
                const rotate = Math.floor(Math.random() * 360); 
                const flip = Math.random() > 0.5 ? -1 : 1; 
                
                let x, y;
                if (isCenter) {
                    // 最初は画面の中央付近
                    x = 22 + (Math.random() * 36); 
                    y = 22 + (Math.random() * 36); 
                } else {
                    // 以降は画面全体・外側まで
                    x = -20 + (Math.random() * 125); 
                    y = -20 + (Math.random() * 125); 
                }
                
                wrapper.style.left = `${x}%`;
                wrapper.style.top = `${y}%`;
                wrapper.style.transform = `rotate(${rotate}deg) scaleX(${flip})`;
                
                const img = document.createElement('img');
                img.src = 'home/hand.png'; 
                img.className = 'hand-img';
                
                wrapper.appendChild(img);
                opening.appendChild(wrapper);
            }

            function runLoop() {
                let batchSize = 1;
                let nextDelay = 480;

                // 【ご要望】段階的なスピードコントロール
                if (count < 6) {
                    // ①【遅】1〜6個目：中央寄りにじっくり1個ずつ（480ms間隔）
                    nextDelay = 480;
                    batchSize = 1;
                } else if (count < 25) {
                    // ②【中】7〜25個目：全体に広がりリズミカルに1個ずつ加速（160ms → 80ms）
                    const p = (count - 6) / (25 - 6);
                    nextDelay = Math.floor(160 - (p * 80));
                    batchSize = 1;
                } else if (count < 65) {
                    // ③【早】26〜65個目：連打ラッシュ（50ms → 20ms、1〜2個ずつ）
                    const p = (count - 25) / (65 - 25);
                    nextDelay = Math.floor(50 - (p * 30));
                    batchSize = Math.floor(1 + (p * 2));
                } else {
                    // ④【バズーカ】66〜200個目：ここで一気に最大25個同時スタンプの超乱射！
                    const p = (count - 65) / (maxCount - 65);
                    nextDelay = 10;
                    batchSize = Math.min(maxCount - count, Math.floor(4 + (p * 22)));
                }

                for (let i = 0; i < batchSize; i++) {
                    if (count >= maxCount) break;
                    stampOne(count < 6);
                    count++;
                }

                if (count < maxCount) {
                    setTimeout(runLoop, nextDelay);
                } else {
                    // 200個完了 → 画面が真っ赤に染まる
                    bloodScreen.style.opacity = '1';
                    
                    // 少しタメを作ってから2.0秒かけてドロっと垂れる
                    setTimeout(() => {
                        opening.style.transition = "transform 2.0s cubic-bezier(0.4, 0, 0.8, 0.3), border-radius 2.0s";
                        opening.style.transform = "translateY(100%)";
                        opening.style.borderTopLeftRadius = "50% 15%";
                        opening.style.borderTopRightRadius = "50% 15%";
                        
                        mainContent.style.opacity = '1';
                        setTimeout(() => { opening.style.display = 'none'; }, 2000);
                    }, 250);
                }
            }

            setTimeout(runLoop, 150);
        };
    </script>
</body>
</html>
