<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    
    <title>恐怖の廃校 - HOME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;900&family=Yuji+Boku&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'OnryouFont';
            src: url('home/onryu.ttf') format('truetype'),
                 url('./home/onryu.ttf') format('truetype'),
                 url('home/onryou.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        *, *::before, *::after, body, h1, h2, h3, p, span, a, button, input, div, header, rt, ruby { 
            font-family: 'OnryouFont', 'Yuji Boku', 'Shippori Mincho', serif !important; 
        }

        body { 
            background-color: #030303; 
            color: #e0e0e0; 
            overflow-x: hidden; 
            min-height: 100dvh; 
        }

        /* 🩸 ドス黒い血の文字（背景が透けてもくっきり読めるシャドウ付き） */
        .text-blood-dark {
            color: #8c0808;
            text-shadow: 2px 2px 4px #000000, 0 0 12px #4a0000, 0 0 25px #000000;
        }
        
        .sub-blood-dark {
            color: #6e0202;
            text-shadow: 1px 1px 2px #000;
        }

        /* オープニング */
        #opening { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            overflow: hidden; display: flex; flex-direction: column; 
        }
        
        .hand-wrapper { 
            position: absolute; 
            pointer-events: none;
            z-index: 9999;
        }
        
        .hand-img { 
            width: 100%; 
            height: auto;
            opacity: 0; 
            transform: scale(0.6); 
            animation: stampIn 0.08s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; 
            filter: drop-shadow(0px 0px 8px rgba(180, 0, 0, 0.8));
        }
        @keyframes stampIn { 
            to { 
                opacity: 0.95; 
                transform: scale(1); 
            } 
        }
        
        #blood-screen { 
            position: absolute; inset: 0; background: #500000; 
            opacity: 0; transition: opacity 0.2s; z-index: 10000; 
            pointer-events: none;
        }

        .shadow-btn { box-shadow: 0 4px 15px rgba(80, 0, 0, 0.7); }
    </style>
</head>
<body class="relative">

    <!-- ========================================================
         🩸 リアル多層グラデーション「血のカーテン」（透明度アップ版）
         ======================================================== -->
    <svg class="fixed top-0 left-0 w-full pointer-events-none z-10 h-44 sm:h-64 opacity-55" viewBox="0 0 1000 240" preserveAspectRatio="none">
        <defs>
            <linearGradient id="dripGradDeep" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3d0000" stop-opacity="0.9" />
                <stop offset="70%" stop-color="#660101" stop-opacity="0.6" />
                <stop offset="100%" stop-color="#210000" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="dripGradFore" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#730202" stop-opacity="0.85" />
                <stop offset="50%" stop-color="#8a0404" stop-opacity="0.6" />
                <stop offset="100%" stop-color="#400000" stop-opacity="0.2" />
            </linearGradient>
        </defs>

        <!-- 奥の滲み血塊 -->
        <path d="M0,0 L1000,0 L1000,50 Q960,190 940,60 Q910,240 880,70 Q840,120 810,50 Q770,220 740,60 Q690,140 660,50 Q610,250 580,70 Q540,120 510,50 Q470,230 440,60 Q390,150 360,50 Q310,240 280,70 Q240,120 210,50 Q160,250 130,60 Q90,160 60,50 Q20,130 0,60 Z" fill="url(#dripGradDeep)" />
        
        <!-- 手前のドロドロ垂れる血のカーテン -->
        <path d="M0,0 L1000,0 L1000,35 Q965,150 945,40 Q915,200 890,55 Q850,100 820,35 Q780,180 755,50 Q705,110 675,40 Q625,210 600,55 Q560,100 530,40 Q485,190 460,45 Q410,120 380,40 Q335,200 310,55 Q265,100 235,35 Q185,210 160,55 Q120,130 90,40 Q40,105 0,40 Z" fill="url(#dripGradFore)" />

        <!-- リアルな滴り筋と雫（半透明） -->
        <g stroke="#800202" stroke-linecap="round" opacity="0.75">
            <line x1="60" y1="50" x2="58" y2="190" stroke-width="3.5" /><circle cx="58" cy="198" r="3.5" fill="#800202" stroke="none" />
            <line x1="160" y1="55" x2="158" y2="225" stroke-width="4.5" /><circle cx="158" cy="234" r="4" fill="#800202" stroke="none" />
            <line x1="310" y1="55" x2="308" y2="205" stroke-width="3.5" /><circle cx="308" cy="213" r="3.5" fill="#800202" stroke="none" />
            <line x1="460" y1="45" x2="462" y2="200" stroke-width="4" /><circle cx="462" cy="208" r="3.5" fill="#800202" stroke="none" />
            <line x1="600" y1="55" x2="598" y2="220" stroke-width="4.5" /><circle cx="598" cy="229" r="4" fill="#800202" stroke="none" />
            <line x1="755" y1="50" x2="753" y2="195" stroke-width="3.5" /><circle cx="753" cy="203" r="3.5" fill="#800202" stroke="none" />
            <line x1="890" y1="55" x2="888" y2="215" stroke-width="4" /><circle cx="888" cy="224" r="4" fill="#800202" stroke="none" />
        </g>
    </svg>

    <!-- ========================================================
         🩸 リアル細密スプラッター血飛沫（四隅・高透過版）
         ======================================================== -->
    <!-- ① 左上スプラッター -->
    <svg class="fixed top-0 left-0 w-64 h-64 pointer-events-none z-10 opacity-45" viewBox="0 0 250 250">
        <path d="M0,0 L130,0 C110,35 140,65 110,85 C80,105 70,140 35,120 C10,110 0,130 0,130 Z" fill="#660101" />
        <g fill="#7a0202">
            <!-- 飛び散る大小無数の粒子 -->
            <circle cx="155" cy="35" r="5" /><circle cx="180" cy="50" r="3" /><circle cx="205" cy="35" r="2" /><circle cx="220" cy="45" r="1.5" />
            <circle cx="135" cy="115" r="5.5" /><circle cx="160" cy="140" r="3.5" /><circle cx="180" cy="165" r="2" /><circle cx="195" cy="180" r="1.2" />
            <circle cx="65" cy="160" r="5" /><circle cx="85" cy="195" r="2.8" /><circle cx="45" cy="215" r="3.5" /><circle cx="30" cy="235" r="1.8" />
            <circle cx="190" cy="95" r="4" /><circle cx="215" cy="115" r="2.5" /><circle cx="230" cy="130" r="1.5" />
        </g>
    </svg>

    <!-- ② 右上スプラッター -->
    <svg class="fixed top-0 right-0 w-64 h-64 pointer-events-none z-10 opacity-45" viewBox="0 0 250 250" style="transform: scaleX(-1);">
        <path d="M0,0 L130,0 C110,35 140,65 110,85 C80,105 70,140 35,120 C10,110 0,130 0,130 Z" fill="#660101" />
        <g fill="#7a0202">
            <circle cx="155" cy="35" r="5" /><circle cx="180" cy="50" r="3" /><circle cx="205" cy="35" r="2" />
            <circle cx="135" cy="115" r="5.5" /><circle cx="160" cy="140" r="3.5" /><circle cx="180" cy="165" r="2" />
            <circle cx="65" cy="160" r="5" /><circle cx="85" cy="195" r="2.8" />
        </g>
    </svg>

    <!-- ③ 左下スプラッター -->
    <svg class="fixed bottom-0 left-0 w-72 h-72 pointer-events-none z-10 opacity-45" viewBox="0 0 250 250" style="transform: scaleY(-1);">
        <path d="M0,0 L140,0 C120,45 150,75 120,100 C90,120 80,160 40,140 C10,130 0,150 0,150 Z" fill="#5c0101" />
        <g fill="#7a0202">
            <circle cx="170" cy="45" r="6" /><circle cx="195" cy="65" r="3" /><circle cx="220" cy="45" r="2" />
            <circle cx="145" cy="135" r="6.5" /><circle cx="175" cy="165" r="4" /><circle cx="200" cy="190" r="2.5" />
            <circle cx="75" cy="180" r="6" /><circle cx="100" cy="215" r="3" /><circle cx="55" cy="235" r="3.5" />
        </g>
    </svg>

    <!-- ④ 右下スプラッター -->
    <svg class="fixed bottom-0 right-0 w-72 h-72 pointer-events-none z-10 opacity-45" viewBox="0 0 250 250" style="transform: scale(-1, -1);">
        <path d="M0,0 L140,0 C120,45 150,75 120,100 C90,120 80,160 40,140 C10,130 0,150 0,150 Z" fill="#5c0101" />
        <g fill="#7a0202">
            <circle cx="170" cy="45" r="6" /><circle cx="195" cy="65" r="3" />
            <circle cx="145" cy="135" r="6.5" /><circle cx="175" cy="165" r="4" /><circle cx="200" cy="190" r="2.5" />
            <circle cx="75" cy="180" r="6" /><circle cx="100" cy="215" r="3" />
        </g>
    </svg>

    <!-- オープニングレイヤー -->
    <div id="opening">
        <div id="blood-screen"></div>
    </div>

    <!-- メインコンテンツ（z-indexを前面にして文字を最高に読みやすく） -->
    <div id="main-content" class="max-w-md mx-auto p-6 min-h-[100dvh] relative opacity-0 transition-opacity duration-700 flex flex-col justify-center z-30">
        
        <!-- ヘッダー -->
        <header class="flex justify-between items-center border-b border-red-950 pb-3 mb-8 text-gray-400 absolute top-8 left-6 right-6 z-30">
            <span class="tracking-widest text-lg">2-1 教室発表</span>
            <button onclick="toggleMenu()" class="text-3xl hover:text-white">☰</button>
        </header>

        <!-- メニュー -->
        <div id="nav-menu" class="hidden flex-col bg-gray-950/95 backdrop-blur p-4 rounded border border-red-950 mb-6 space-y-3 text-base absolute top-20 right-6 z-50 shadow-2xl">
            <a href="timeattack.html" class="text-red-600 hover:text-red-400">✝ スタッフ用: タイム計測＆謎発動</a>
            <a href="admin.html" class="text-red-600 hover:text-red-400">✝ 管理者設定</a>
        </div>

        <!-- タイトルエリア（ルビ付き・ドス黒い赤） -->
        <div class="text-center mb-10 mt-20 relative">
            <h1 class="text-4xl sm:text-5xl font-black tracking-widest text-blood-dark mb-2 leading-relaxed relative z-10" id="story-title">
                <ruby>恐怖<rt class="text-xs sm:text-sm sub-blood-dark tracking-widest">おののき</rt></ruby>の<ruby>廃校<rt class="text-xs sm:text-sm sub-blood-dark tracking-widest">エコールデザフェクテ</rt></ruby>
            </h1>
        </div>

        <!-- あらすじエリア -->
        <div class="mb-10 text-center flex-1 relative">
            <p class="text-blood-dark mb-4 text-2xl tracking-widest">〜 あらすじ 〜</p>
            
            <svg class="w-full h-5 text-red-950 mb-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 200 15" preserveAspectRatio="none">
                <path d="M0,7 Q25,0 50,7 T100,7 T150,7 T200,7" stroke-width="1.5"></path>
                <circle cx="75" cy="11" r="1.5" fill="currentColor" stroke="none" />
                <circle cx="140" cy="12" r="2" fill="currentColor" stroke="none" />
            </svg>
            
            <p id="story-text" class="text-xl text-gray-300 leading-loose px-4 font-bold">
                読込中...
            </p>
            
            <svg class="w-full h-5 text-red-950 mt-4 opacity-75" fill="none" stroke="currentColor" viewBox="0 0 200 15" preserveAspectRatio="none">
                <path d="M0,7 Q25,14 50,7 T100,7 T150,7 T200,7" stroke-width="1.5"></path>
                <circle cx="45" cy="12" r="1.8" fill="currentColor" stroke="none" />
                <circle cx="165" cy="11" r="1.5" fill="currentColor" stroke="none" />
            </svg>
        </div>

        <!-- 予約ボタンエリア -->
        <div class="mb-8 text-center px-2 relative">
            <h2 class="text-2xl text-blood-dark mb-4 tracking-widest font-bold">予約</h2>
            <p class="text-base text-gray-400 mb-1">下のボタンから予約をすることができます。</p>
            <p class="text-base text-gray-400 mb-3">前日でも当日でも予約可能です。</p>
            <a href="#" class="inline-block mb-4 text-base text-red-600 hover:text-red-400 underline decoration-red-900">詳しいやり方、注意点はこちらから</a>
            
            <div class="relative">
                <a href="ticket.html" class="block w-full py-4 bg-[#260101] border border-[#520202] text-blood-dark text-2xl hover:bg-black transition tracking-widest shadow-btn relative z-10">
                    予約 はこちらから
                </a>
                <svg class="w-full h-4 text-[#520202] -mt-1 relative z-0 opacity-80" viewBox="0 0 300 20" preserveAspectRatio="none" fill="currentColor">
                    <path d="M20,0 Q30,18 40,0 M140,0 Q150,22 160,0 M240,0 Q250,16 260,0" />
                    <circle cx="40" cy="18" r="1.5" />
                    <circle cx="150" cy="22" r="2" />
                    <circle cx="250" cy="16" r="1.5" />
                </svg>
            </div>
        </div>

        <!-- ランキングボタンエリア -->
        <div class="mb-4 text-center px-2">
            <h2 class="text-2xl text-blood-dark mb-4 tracking-widest font-bold">ランキング</h2>
            <p class="text-base text-gray-400 mb-4">上位TOP3まで表示されます</p>
            <a href="ranking.html" class="block w-full py-4 bg-gray-950 border border-gray-800 text-gray-300 text-xl hover:bg-gray-900 transition tracking-widest">
                ランキングはこちらから
            </a>
        </div>
    </div>

    <script>
        try {
            db.collection('settings').doc('config').onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    if (data.storyText) {
                        document.getElementById('story-text').innerHTML = data.storyText.replace(/\n/g, '<br>');
                    }
                }
            });
        } catch (e) {}

        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        // 🩸 拍子木リズム・オープニング
        window.onload = () => {
            const opening = document.getElementById('opening');
            const bloodScreen = document.getElementById('blood-screen');
            const mainContent = document.getElementById('main-content');
            
            let count = 0;
            const maxCount = 220; 

            function stampOne(isCenter = false) {
                const wrapper = document.createElement('div');
                wrapper.className = 'hand-wrapper';
                
                const size = 160 + (Math.random() * 220); 
                wrapper.style.width = `${size}px`;
                
                const rotate = Math.floor(Math.random() * 360); 
                const flip = Math.random() > 0.5 ? -1 : 1; 
                
                let x, y;
                if (isCenter) {
                    x = 22 + (Math.random() * 32); 
                    y = 22 + (Math.random() * 32); 
                } else {
                    x = -2 + (Math.random() * 84); 
                    y = -2 + (Math.random() * 84); 
                }
                
                wrapper.style.left = `${x}%`;
                wrapper.style.top = `${y}%`;
                wrapper.style.transform = `rotate(${rotate}deg) scaleX(${flip})`;
                
                const img = document.createElement('img');
                img.src = 'home/hand.png'; 
                img.className = 'hand-img';
                
                wrapper.appendChild(img);
                opening.appendChild(wrapper);
            }

            function runLoop() {
                let batchSize = 1;
                let nextDelay = 850;

                if (count < 15) {
                    nextDelay = Math.max(70, Math.floor(850 * Math.pow(0.85, count)));
                    batchSize = 1;
                } else if (count < 50) {
                    const p = (count - 15) / (50 - 15);
                    nextDelay = Math.max(15, Math.floor(65 - (p * 45)));
                    batchSize = Math.floor(1 + (p * 2));
                } else {
                    const p = (count - 50) / (maxCount - 50);
                    nextDelay = 12;
                    batchSize = Math.min(maxCount - count, Math.floor(4 + (p * 12)));
                }

                for (let i = 0; i < batchSize; i++) {
                    if (count >= maxCount) break;
                    stampOne(count < 7);
                    count++;
                }

                if (count < maxCount) {
                    setTimeout(runLoop, nextDelay);
                } else {
                    bloodScreen.style.opacity = '1';
                    setTimeout(() => {
                        opening.style.transition = "transform 2.0s cubic-bezier(0.4, 0, 0.8, 0.3), border-radius 2.0s";
                        opening.style.transform = "translateY(100%)";
                        opening.style.borderTopLeftRadius = "50% 15%";
                        opening.style.borderTopRightRadius = "50% 15%";
                        
                        mainContent.style.opacity = '1';
                        setTimeout(() => { opening.style.display = 'none'; }, 2000);
                    }, 250);
                }
            }

            setTimeout(runLoop, 150);
        };
    </script>
</body>
</html>
